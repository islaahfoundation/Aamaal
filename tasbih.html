<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tasbih — Interactive 3D Counter (Screens 21–36)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-950: #041410;
      --emerald-900: #08221b;
      --emerald-800: #0f352b;
      --emerald-700: #184d3f;
      --mint-400: #6ee7b7;
      --mint-300: #99f6e4;
      --gold-400: #fbbf24;
      --gold-300: #fcd34d;
      --gold-200: #fde68a;
      --glass-bg: rgba(9, 32, 25, 0.68);
      --glass-border: rgba(134, 239, 172, 0.24);
      --sheet-bg: #071d17;
      --text-main: #f4fbf8;
      --text-muted: rgba(215, 240, 230, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #0d2b22 0%, #030d0a 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Developer Background Switcher & State Bar (Outside Phone Frame) */
    .dev-toolbar {
      width: 100%;
      max-width: 412px;
      background: rgba(7, 26, 21, 0.9);
      border: 1px solid rgba(110, 231, 183, 0.22);
      border-radius: 14px;
      padding: 8px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      backdrop-filter: blur(12px);
      font-size: 12px;
      z-index: 100;
    }

    .dev-toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dev-label {
      color: var(--mint-400);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .dev-select, .dev-btn {
      background: rgba(15, 53, 43, 0.85);
      color: #e6f7f0;
      border: 1px solid rgba(110, 231, 183, 0.3);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .dev-btn:hover, .dev-select:hover {
      border-color: var(--mint-400);
    }

    /* Phone Frame */
    .phone-frame {
      position: relative;
      width: 392px;
      height: 848px;
      border-radius: 48px;
      background: #051612;
      box-shadow:
        0 0 0 3px #2c3e37,
        0 0 0 7px #121c18,
        0 30px 70px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Background Layer */
    .bg-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.35s ease;
    }

    .bg-scenic-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .bg-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(4, 18, 14, 0.25) 0%,
        rgba(4, 20, 16, 0.15) 35%,
        rgba(4, 22, 17, 0.55) 75%,
        rgba(3, 15, 12, 0.92) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    /* Status Bar */
    .status-bar {
      position: relative;
      z-index: 10;
      height: 44px;
      padding: 14px 28px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
      pointer-events: none;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Clean Header (No navigation buttons as requested) */
    .app-header {
      position: relative;
      z-index: 10;
      padding: 12px 24px 10px;
      pointer-events: none;
    }

    .app-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 38px;
      font-weight: 600;
      line-height: 1.05;
      color: #f7fcf9;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .app-subtitle {
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 400;
      color: rgba(226, 245, 237, 0.85);
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    /* Wird / Dhikr Selector Pill (Top Card) */
    .wird-card-wrap {
      position: relative;
      z-index: 15;
      padding: 6px 20px 0;
    }

    .wird-card {
      width: 100%;
      background: rgba(11, 37, 29, 0.66);
      border: 1px solid rgba(148, 233, 195, 0.28);
      border-radius: 36px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .wird-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    /* Perfectly Fitted Circular Arabic Calligraphy Medallion */
    .arabic-badge {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #163d31 0%, #071914 100%);
      border: 1.2px solid rgba(251, 191, 36, 0.5);
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.16), inset 0 0 8px rgba(251, 191, 36, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
    }

    .arabic-badge svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .wird-info {
      min-width: 0;
      flex: 1;
    }

    .wird-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wird-name {
      font-size: 16.5px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wird-Meaning {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wird-divider {
      width: 1px;
      height: 34px;
      background: rgba(167, 243, 208, 0.2);
      margin: 0 12px;
    }

    .wird-goal-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 4px 4px 4px 2px;
      border-radius: 18px;
      transition: transform 0.15s ease;
    }

    .wird-goal-btn:active {
      transform: scale(0.95);
    }

    .goal-meta {
      text-align: right;
    }

    .goal-label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
    }

    .goal-value {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .target-icon-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(251, 191, 36, 0.55);
      background: rgba(251, 191, 36, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-300);
    }

    /* Interactive Touch & Swipe Zone ( strictly between Wird dropdown and Progress Bar ) */
    .interactive-counter-zone {
      position: relative;
      z-index: 12;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
      overflow: hidden;
    }

    /* Center Medallion & Count Readout */
    .center-medallion {
      position: absolute;
      width: 168px;
      height: 168px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(13, 48, 38, 0.55) 0%, rgba(5, 22, 17, 0.2) 72%, transparent 100%);
      border: 1px solid rgba(110, 231, 183, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 3;
      margin-top: -38px;
    }

    .center-medallion::before {
      content: '';
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      border: 1px dashed rgba(110, 231, 183, 0.18);
    }

    .main-count-number {
      font-size: 56px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.03em;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
      transition: transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .main-count-number.bump {
      transform: scale(1.09);
    }

    .main-count-goal {
      margin-top: 6px;
      font-size: 16px;
      font-weight: 500;
      color: rgba(215, 240, 230, 0.72);
    }

    /* First-POV 3D Tasbih Ring + Golden Tassel Canvas/SVG Container */
    .tasbih-stage {
      position: relative;
      width: 360px;
      height: 455px;
      pointer-events: none;
      z-index: 4;
    }

    /* Floating +1 Badge — Hidden by default, only shown when triggered/selected */
    .plus-one-pill {
      position: absolute;
      right: 26px;
      top: 238px;
      background: rgba(18, 56, 44, 0.85);
      border: 1px solid rgba(134, 239, 172, 0.45);
      color: #ecfdf5;
      font-size: 14px;
      font-weight: 600;
      padding: 5px 13px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 12px rgba(251, 191, 36, 0.25);
      opacity: 0;
      transform: translateY(8px) scale(0.88);
      transition: opacity 0.22s ease, transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 8;
    }

    .plus-one-pill.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Subtle Micro Utility Floating Actions (Undo / Sound / Haptics / History) inside Bottom Card */
    .bottom-card-wrap {
      position: relative;
      z-index: 15;
      padding: 0 20px 26px;
    }

    .progress-card {
      background: rgba(8, 29, 23, 0.72);
      border: 1px solid rgba(134, 239, 172, 0.24);
      border-radius: 24px;
      padding: 16px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    }

    .progress-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .progress-track {
      flex: 1;
      height: 12px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 27%;
      border-radius: 999px;
      background: linear-gradient(90deg, #86efac 0%, #a7f3d0 100%);
      box-shadow: 0 0 12px rgba(134, 239, 172, 0.55);
      transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .progress-pct {
      font-size: 13.5px;
      font-weight: 600;
      color: #f0fdf4;
      min-width: 38px;
      text-align: right;
    }

    .progress-stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .stat-col {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .stat-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-300);
    }

    .stat-icon.mint {
      border-color: rgba(110, 231, 183, 0.4);
      background: rgba(110, 231, 183, 0.08);
      color: var(--mint-400);
    }

    .stat-label {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 1px;
    }

    .stat-divider {
      width: 1px;
      height: 32px;
      background: rgba(167, 243, 208, 0.16);
      margin: 0 14px;
    }

    /* Quick Mini Controls Strip inside Progress Card Footer */
    .quick-controls-strip {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(167, 243, 208, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .qc-btn {
      background: rgba(17, 56, 45, 0.55);
      border: 1px solid rgba(134, 239, 172, 0.2);
      color: rgba(236, 253, 245, 0.88);
      border-radius: 10px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .qc-btn:hover {
      border-color: rgba(134, 239, 172, 0.5);
      background: rgba(22, 72, 58, 0.75);
    }

    .qc-btn.active {
      border-color: var(--gold-400);
      color: var(--gold-200);
    }

    /* Bottom Sheets & Modals (Screens 22–36) */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 10, 8, 0.62);
      backdrop-filter: blur(4px);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      background: linear-gradient(180deg, #0b2920 0%, #051611 100%);
      border-top: 1px solid rgba(134, 239, 172, 0.28);
      border-radius: 32px 32px 0 0;
      padding: 12px 20px 28px;
      max-height: 78%;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -16px 40px rgba(0, 0, 0, 0.75);
    }

    .sheet-backdrop.open .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 42px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.25);
      margin: 4px auto 16px;
    }

    .sheet-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
    }

    .sheet-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 16px;
    }

    /* Dhikr Option List (Matches Reference Screen 2) */
    .dhikr-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dhikr-item {
      background: rgba(12, 40, 32, 0.65);
      border: 1px solid rgba(134, 239, 172, 0.16);
      border-radius: 22px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .dhikr-item.selected {
      background: linear-gradient(90deg, rgba(20, 68, 53, 0.85) 0%, rgba(13, 47, 37, 0.85) 100%);
      border: 1.5px solid #6ee7b7;
      box-shadow: 0 0 20px rgba(110, 231, 183, 0.18);
    }

    .dhikr-item-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .dhikr-item.selected .arabic-badge {
      border-color: var(--gold-300);
      box-shadow: 0 0 16px rgba(251, 191, 36, 0.35);
    }

    .dhikr-item-right {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.65);
    }

    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #86efac;
      color: #052e16;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    /* Form Controls inside Sheets */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--mint-300);
      margin-bottom: 5px;
    }

    .form-input {
      width: 100%;
      background: rgba(6, 22, 17, 0.9);
      border: 1px solid rgba(134, 239, 172, 0.28);
      border-radius: 12px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--mint-400);
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .preset-pill {
      background: rgba(14, 46, 36, 0.75);
      border: 1px solid rgba(134, 239, 172, 0.24);
      border-radius: 16px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 18px;
      color: #ffffff;
    }

    .preset-pill.selected {
      border-color: var(--mint-400);
      background: rgba(22, 78, 61, 0.9);
      box-shadow: 0 0 14px rgba(110, 231, 183, 0.25);
    }

    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
      color: #032218;
      font-weight: 700;
      font-size: 14.5px;
      border: none;
      border-radius: 16px;
      padding: 12px 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    .btn-secondary {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      color: #e6f7f0;
      font-weight: 600;
      font-size: 13.5px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px;
      padding: 11px 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Toast Notification */
    .state-toast {
      position: absolute;
      top: 132px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(7, 28, 22, 0.94);
      border: 1px solid rgba(110, 231, 183, 0.45);
      color: #ecfdf5;
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 12.5px;
      font-weight: 500;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }

    .state-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Developer Toolbar (Background Switcher & Screen State Jump for Testing 21–36) -->
  <div class="dev-toolbar">
    <div class="dev-toolbar-group">
      <span class="dev-label">BG:</span>
      <select id="bgSelector" class="dev-select" title="Switch background during development">
        <option value="emerald-mosque">1. Twilight Mosque Lake (Ref)</option>
        <option value="misty-forest">2. Emerald Pine Sanctuary</option>
        <option value="desert-night">3. Golden Desert Crescent</option>
        <option value="minimal-dark">4. Pure Obsidian Emerald</option>
        <option value="custom-upload">5. Upload Custom URL/Image...</option>
      </select>
      <input type="file" id="bgFileInput" accept="image/*" style="display:none" />
    </div>

    <div class="dev-toolbar-group">
      <span class="dev-label">State (21–36):</span>
      <select id="stateSelector" class="dev-select">
        <option value="21">21 · Main Tasbih Screen</option>
        <option value="22">22 · Dhikr Selector Sheet</option>
        <option value="23">23 · Custom Dhikr Editor</option>
        <option value="24">24 · Goal Selector (33/100/1000)</option>
        <option value="25">25 · Custom Goal Entry</option>
        <option value="26">26 · Counting Interaction Demo</option>
        <option value="27">27 · Counter Feedback (+1 Visible)</option>
        <option value="28">28 · Sound Controls</option>
        <option value="29">29 · Haptic Controls</option>
        <option value="30">30 · Undo Last Count</option>
        <option value="31">31 · Reset Confirmation</option>
        <option value="32">32 · Goal Reached Celebration</option>
        <option value="33">33 · Continue / Another Round</option>
        <option value="34">34 · Session Saved Confirmation</option>
        <option value="35">35 · Tasbih History</option>
        <option value="36">36 · Session Detail</option>
      </select>
    </div>
  </div>

  <!-- Main iPhone Container -->
  <div class="phone-frame" id="phoneFrame">

    <!-- Dynamic Background Layer -->
    <div class="bg-layer" id="bgLayer"></div>
    <div class="bg-overlay"></div>

    <!-- iOS Status Bar -->
    <div class="status-bar">
      <span>9:41</span>

    /********************************************************************
     * 4. FIRST-POV 3D TASBIH BEADS RING RENDERER (MATCHING REFERENCE IMAGE)
     ********************************************************************/
    function renderTasbihBeads() {
      const group = document.getElementById('beadsRingGroup');
      const totalBeads = 20;
      const cx = 180;
      const cy = 176;
      const radius = 130;

      // Active glowing bead positioned at lower-right (~42 degrees from right horizontal)
      const activeBeadIndex = 2;
      let html = '';

      // Slight rotational offset during bead advancement
      const angleShift = (state.beadRotationStep % 1) * (360 / totalBeads);

      for (let i = 0; i < totalBeads; i++) {
        // Start from 0 deg (3 o'clock) clockwise; leave small gap at bottom (90 deg) for Imame
        const deg = (i * (360 / totalBeads)) - 8 + angleShift;
        const rad = (deg * Math.PI) / 180;
        const x = cx + radius * Math.cos(rad);
        const y = cy + radius * Math.sin(rad);

        // Gold Spacer Disc halfway between current bead and next bead
        const nextDeg = ((i + 0.5) * (360 / totalBeads)) - 8 + angleShift;
        const nextRad = (nextDeg * Math.PI) / 180;
        const sx = cx + radius * Math.cos(nextRad);
        const sy = cy + radius * Math.sin(nextRad);

        html += `
          <g transform="translate(${sx.toFixed(1)}, ${sy.toFixed(1)}) rotate(${(nextDeg + 90).toFixed(1)})">
            <ellipse cx="0" cy="0" rx="5.2" ry="2.6" fill="url(#goldMetallic)" />
          </g>
        `;

        const isActive = (i === activeBeadIndex);

        if (isActive) {
          html += `
            <g filter="url(#activeGlowFilter)">
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="21" fill="none" stroke="#fbbf24" stroke-width="2.2" opacity="0.9"/>
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16.8" fill="url(#activeBeadGrad)"/>
              <circle cx="${(x - 4.5).toFixed(1)}" cy="${(y - 5).toFixed(1)}" r="4.2" fill="rgba(255,255,255,0.85)"/>
            </g>
          `;
        } else {
          // Subtle organic marble veins per bead
          const veinRot = (i * 47) % 360;
          html += `
            <g filter="url(#beadDropShadow)">
              <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="16.2" fill="url(#marbleBeadGrad)"/>
              <g transform="translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${veinRot})" opacity="0.32">
                <path d="M-9 -4 Q-2 2 8 -5" stroke="#785932" stroke-width="1.2" fill="none"/>
                <path d="M-6 6 Q3 1 10 7" stroke="#5c4020" stroke-width="0.9" fill="none"/>
              </g>
              <circle cx="${(x - 4.5).toFixed(1)}" cy="${(y - 5).toFixed(1)}" r="3.6" fill="rgba(255,255,255,0.55)"/>
            </g>
          `;
        }
      }

      group.innerHTML = html;
    }

    /********************************************************************
     * 5. WEB AUDIO WOODEN BEAD CLICK & HAPTIC FEEDBACK
     ********************************************************************/
    let audioCtx = null;
    function playWoodenBeadClick() {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(95, now + 0.045);

        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.048);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } catch (e) {}
    }

    function triggerHaptic(ms = 18) {

        navigator.vibrate(ms);

      document.getElementById('headerGoalValue').textContent = state.goal;
      document.getElementById('mainCountDisplay').textContent = state.count;
      document.getElementById('mainGoalSubDisplay').textContent = `/ ${state.goal}`;

      const pct = Math.min(100, Math.round((state.count / state.goal) * 100));
      document.getElementById('progressFill').style.width = `${pct}%`;
      document.getElementById('progressPct').textContent = `${pct}%`;

      document.getElementById('bottomGoalVal').textContent = state.goal;
      document.getElementById('bottomCompletedVal').textContent = state.count;

      renderTasbihBeads();
    }

    function flashPlusOneBadge() {
      const pill = document.getElementById('plusOnePill');
      pill.classList.add('visible');
      if (plusOneTimer) clearTimeout(plusOneTimer);
      plusOneTimer = setTimeout(() => {
        if (!state.plusOneForcedByState) {
          pill.classList.remove('visible');
        }
      }, 650);
    }

    function showToast(msg) {
      const t = document.getElementById('stateToast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2100);
    }

    /********************************************************************
     * 7. SINGLE-COUNT INCREMENT ENGINE (TAPS & LONG SWIPES = 1 COUNT)
     ********************************************************************/
    function incrementCount() {
      state.count += 1;
      state.beadRotationStep = 0.45;
      updateUI();

      // Number bump animation
      const numEl = document.getElementById('mainCountDisplay');
      numEl.classList.remove('bump');
      void numEl.offsetWidth;
      numEl.classList.add('bump');

      // Tassel sway animation
      const tassel = document.getElementById('tasselGroup');
      tassel.style.transition = 'transform 0.18s ease-out';
      tassel.setAttribute('transform', 'translate(180, 306) rotate(4.5)');
      setTimeout(() => {
        state.beadRotationStep = 0;
        renderTasbihBeads();
        tassel.setAttribute('transform', 'translate(180, 306) rotate(0)');
      }, 160);

      flashPlusOneBadge();
      playWoodenBeadClick();
      triggerHaptic(18);

      if (state.count === state.goal) {
        triggerHaptic([40, 60, 80]);
        setTimeout(() => openSheetForState('32'), 320);
      }
    }

    // Strictly 1 count per gesture (whether quick tap or long swipe across the zone)
    function setupTouchAndSwipeZone() {
      const zone = document.getElementById('counterTouchZone');
      let gestureActive = false;
      let gestureCounted = false;
      let startX = 0;
      let startY = 0;

      zone.addEventListener('pointerdown', (e) => {
        if (e.button && e.button !== 0) return;
        gestureActive = true;
        gestureCounted = false;
        startX = e.clientX;
        startY = e.clientY;
        zone.setPointerCapture(e.pointerId);
      });

      zone.addEventListener('pointermove', (e) => {
        if (!gestureActive || gestureCounted) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const dist = Math.hypot(dx, dy);

        // If user performs a swipe of 24px or more (even a very long swipe), count ONCE immediately
        if (dist >= 24) {
          gestureCounted = true;
          incrementCount();
        }
      });

      zone.addEventListener('pointerup', () => {
        if (!gestureActive) return;
        // If it was a tap (didn't cross swipe distance threshold yet), count ONCE on release
        if (!gestureCounted) {
          incrementCount();
        }
        gestureActive = false;
        gestureCounted = false;
      });

      zone.addEventListener('pointercancel', () => {
        gestureActive = false;
        gestureCounted = false;
      });

      // Spacebar support
      window.addEventListener('keydown', (e) => {
        const backdropOpen = document.getElementById('sheetBackdrop').classList.contains('open');
        if (e.code === 'Space' && !backdropOpen && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          incrementCount();
        }
      });
    }

    /********************************************************************
     * 8. ALL 16 FUNCTIONAL SCREENS & STATES (21–36)
     ********************************************************************/
    function closeSheet() {
      document.getElementById('sheetBackdrop').classList.remove('open');
    }

    function openSheetForState(stateCode) {
      const backdrop = document.getElementById('sheetBackdrop');
      const content = document.getElementById('sheetContent');
      state.plusOneForcedByState = (stateCode === '27');
      document.getElementById('plusOnePill').classList.toggle('visible', state.plusOneForcedByState);

      if (stateCode === '21') {
        closeSheet();
        return;
      }

      if (stateCode === '26') {
        closeSheet();
        incrementCount();
        showToast('Tap or swipe anywhere in the middle area to count');
        return;
      }

      if (stateCode === '27') {
        closeSheet();
        document.getElementById('plusOnePill').classList.add('visible');
        showToast('State 27: Floating +1 & Active Bead Highlight');
        return;
      }

      if (stateCode === '30') {
        closeSheet();
        if (state.count > 0) {
          state.count -= 1;
          updateUI();
          showToast('Last count undone (-1)');
        }
        return;
      }

      if (stateCode === '34') {
        closeSheet();
        state.history.unshift({
          id: Date.now(),
          date: 'Just now',
          dhikr: state.selectedDhikr.name,
          arabic: state.selectedDhikr.arabic,
          count: state.count,
          goal: state.goal,
          duration: '2m 45s'
        });
        showToast('✓ Session saved to Tasbih history');
        return;
      }

      // Render Sheet Contents for Modal States
      let html = `<div class="sheet-handle"></div>`;

      if (stateCode === '22') {
        html += `
          <h2 class="sheet-title">Select Dhikr</h2>
          <p class="sheet-subtitle">Choose the dhikr you want to count</p>
          <div class="dhikr-list">
            ${DHIKR_CATALOG.map(item => {
              const isSel = item.id === state.selectedDhikr.id;
              return `
                <div class="dhikr-item ${isSel ? 'selected' : ''}" data-dhikr-id="${item.id}">
                  <div class="dhikr-item-left">
                    <div class="arabic-badge">${item.svgCalligraphy}</div>
                    <div>
                      <div class="wird-name">${item.name}</div>
                      <div class="wird-Meaning">${item.meaning}</div>
                    </div>
                  </div>
                  <div class="dhikr-item-right">
                    <span>›</span>
                    ${isSel ? '<span class="check-circle">✓</span>' : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          <button class="btn-secondary" id="goToCustomDhikrBtn">+ Create Custom Dhikr (State 23)</button>
        `;
      } else if (stateCode === '23') {
        html += `
          <h2 class="sheet-title">Custom Dhikr</h2>
          <p class="sheet-subtitle">Add your own phrase, Arabic text & meaning</p>
          <div class="form-group">
            <label class="form-label">Transliteration / Phrase</label>
            <input class="form-input" id="customNameInput" placeholder="La ilaha illallah" value="La ilaha illallah" />
          </div>
          <div class="form-group">
            <label class="form-label">Arabic Text (Fits inside circle)</label>
            <input class="form-input" id="customArabicInput" placeholder="لَا إِلَٰهَ إِلَّا ٱللَّٰهُ" value="لَا إِلَٰهَ إِلَّا الله" />
          </div>
          <div class="form-group">
            <label class="form-label">Translation / Meaning</label>
            <input class="form-input" id="customMeaningInput" placeholder="There is no god but Allah" value="There is no god worthy of worship except Allah" />
          </div>
          <button class="btn-primary" id="saveCustomDhikrBtn">Save & Select Dhikr</button>
        `;
      } else if (stateCode === '24' || stateCode === '25') {
        html += `
          <h2 class="sheet-title">Select Goal</h2>
          <p class="sheet-subtitle">Choose a preset target or enter a custom goal</p>
          <div class="preset-grid">
            ${[33, 100, 1000].map(g => `
              <div class="preset-pill ${state.goal === g ? 'selected' : ''}" data-goal-val="${g}">${g}</div>
            `).join('')}
          </div>
          <div class="form-group">
            <label class="form-label">Custom Goal Target (State 25)</label>
            <input type="number" class="form-input" id="customGoalInput" value="${state.goal}" min="1" max="100000" />
          </div>
          <button class="btn-primary" id="applyCustomGoalBtn">Apply Target Goal</button>
        `;
      } else if (stateCode === '28' || stateCode === '29') {
        html += `
          <h2 class="sheet-title">Sound & Haptics</h2>
          <p class="sheet-subtitle">Configure wooden bead click audio and vibration</p>
          <button class="btn-primary" id="sheetToggleSoundBtn">
            ${state.soundEnabled ? '🔊 Wooden Bead Sound: ON' : '🔇 Wooden Bead Sound: MUTED'}
          </button>
          <button class="btn-secondary" id="sheetToggleHapticBtn">
            ${state.hapticEnabled ? '📳 Haptic Vibration: ENABLED' : '📴 Haptic Vibration: DISABLED'}
          </button>
        `;
      } else if (stateCode === '31') {
        html += `
          <h2 class="sheet-title">Reset Counter?</h2>
          <p class="sheet-subtitle">Are you sure you want to reset your current count (${state.count}) back to 0?</p>
          <button class="btn-primary" id="confirmResetBtn">Yes, Reset to 0</button>
          <button class="btn-secondary" onclick="closeSheet()">Cancel</button>
        `;
      } else if (stateCode === '32' || stateCode === '33') {
        html += `
          <h2 class="sheet-title">Masha’Allah! Goal Reached ✨</h2>
          <p class="sheet-subtitle">You completed ${state.count} counts of ${state.selectedDhikr.name}.</p>
          <button class="btn-primary" id="startAnotherRoundBtn">Start Another Round (Reset to 0)</button>
          <button class="btn-secondary" id="continueCountingBtn">Continue Counting Past Goal</button>
          <button class="btn-secondary" id="saveAndViewHistoryBtn">Save Session & View Log</button>
        `;
      } else if (stateCode === '35') {
        html += `
          <h2 class="sheet-title">Tasbih History</h2>
          <p class="sheet-subtitle">Tap any recorded session to view full details (State 36)</p>
          <div class="dhikr-list">
            ${state.history.map((h, idx) => `
              <div class="dhikr-item" data-history-idx="${idx}">
                <div>
                  <div class="wird-name">${h.dhikr} · ${h.count}/${h.goal}</div>
                  <div class="wird-Meaning">${h.date} · Duration: ${h.duration}</div>
                </div>
                <div class="dhikr-item-right"><span>Details ›</span></div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (stateCode === '36') {
        const item = state.history[0];
        html += `
          <h2 class="sheet-title">Session Detail</h2>
          <p class="sheet-subtitle">Completed Dhikr Record</p>
          <div class="dhikr-item selected" style="margin-bottom:12px;">
            <div>
              <div class="wird-name">${item.dhikr} (${item.arabic})</div>
              <div class="wird-Meaning">Date: ${item.date}</div>
              <div class="wird-Meaning">Completed: ${item.count} / ${item.goal} · Duration: ${item.duration}</div>
            </div>
          </div>
          <button class="btn-secondary" id="backToHistoryBtn">← Back to History List</button>
        `;
      }

      content.innerHTML = html;
      backdrop.classList.add('open');
      bindSheetEvents();
    }

    function bindSheetEvents() {
      document.querySelectorAll('[data-dhikr-id]').forEach(el => {
        el.addEventListener('click', () => {
          const found = DHIKR_CATALOG.find(d => d.id === el.getAttribute('data-dhikr-id'));
          if (found) {
            state.selectedDhikr = found;
            updateUI();
            closeSheet();
          }
        });
      });

      const customBtn = document.getElementById('goToCustomDhikrBtn');
      if (customBtn) customBtn.addEventListener('click', () => openSheetForState('23'));

      const saveCustomBtn = document.getElementById('saveCustomDhikrBtn');
      if (saveCustomBtn) {
        saveCustomBtn.addEventListener('click', () => {
          const name = document.getElementById('customNameInput').value.trim() || 'Custom Dhikr';
          const arabic = document.getElementById('customArabicInput').value.trim() || 'ذِكْر';
          const meaning = document.getElementById('customMeaningInput').value.trim() || 'Remembrance of Allah';
          const newEntry = {
            id: 'custom-' + Date.now(),
            name,
            arabic,
            meaning,
            svgCalligraphy: `
              <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <text x="32" y="38" text-anchor="middle" fill="#fde68a" font-family="'Amiri', serif" font-weight="700" font-size="14">${arabic}</text>
              </svg>`
          };
          DHIKR_CATALOG.push(newEntry);
          state.selectedDhikr = newEntry;
          updateUI();
          closeSheet();
          showToast('Custom Dhikr added');
        });
      }

      document.querySelectorAll('[data-goal-val]').forEach(el => {
        el.addEventListener('click', () => {
          state.goal = parseInt(el.getAttribute('data-goal-val'), 10);
          updateUI();
          closeSheet();
        });
      });

      const applyGoalBtn = document.getElementById('applyCustomGoalBtn');
      if (applyGoalBtn) {
        applyGoalBtn.addEventListener('click', () => {
          const val = parseInt(document.getElementById('customGoalInput').value, 10);
          if (val > 0) {
            state.goal = val;
            updateUI();
            closeSheet();
          }
        });
      }

      const sheetSound = document.getElementById('sheetToggleSoundBtn');
      if (sheetSound) {
        sheetSound.addEventListener('click', () => {
          state.soundEnabled = !state.soundEnabled;
          document.getElementById('soundToggleBtn').classList.toggle('active', state.soundEnabled);
          openSheetForState('28');
        });
      }

      const sheetHaptic = document.getElementById('sheetToggleHapticBtn');
      if (sheetHaptic) {
        sheetHaptic.addEventListener('click', () => {
          state.hapticEnabled = !state.hapticEnabled;
          document.getElementById('hapticToggleBtn').classList.toggle('active', state.hapticEnabled);
          openSheetForState('29');
        });
      }

      const confirmReset = document.getElementById('confirmResetBtn');
      if (confirmReset) {
        confirmReset.addEventListener('click', () => {
          state.count = 0;
          updateUI();
          closeSheet();
          showToast('Counter reset to 0');
        });
      }

      const anotherRound = document.getElementById('startAnotherRoundBtn');
      if (anotherRound) {
        anotherRound.addEventListener('click', () => {
          state.count = 0;
          updateUI();
          closeSheet();
          showToast('New round started');
        });
      }

      const contBtn = document.getElementById('continueCountingBtn');
      if (contBtn) contBtn.addEventListener('click', closeSheet);

      const saveHistBtn = document.getElementById('saveAndViewHistoryBtn');
      if (saveHistBtn) {
        saveHistBtn.addEventListener('click', () => {
          openSheetForState('34');
          setTimeout(() => openSheetForState('35'), 600);
        });
      }

      document.querySelectorAll('[data-history-idx]').forEach(el => {
        el.addEventListener('click', () => openSheetForState('36'));
      });

      const backHist = document.getElementById('backToHistoryBtn');
      if (backHist) backHist.addEventListener('click', () => openSheetForState('35'));
    }

    /********************************************************************
     * 9. INITIALIZATION & EVENT LISTENERS
     ********************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      applyBackground('emerald-mosque');
      updateUI();
      setupTouchAndSwipeZone();

      // Top Card Triggers
      document.getElementById('openDhikrSheetBtn').addEventListener('click', () => openSheetForState('22'));
      document.getElementById('openGoalSheetBtn').addEventListener('click', () => openSheetForState('24'));
      document.getElementById('bottomGoalTrigger').addEventListener('click', () => openSheetForState('24'));
      document.getElementById('bottomHistoryTrigger').addEventListener('click', () => openSheetForState('35'));

      // Mini Controls Strip
      document.getElementById('undoBtn').addEventListener('click', () => openSheetForState('30'));
      document.getElementById('soundToggleBtn').addEventListener('click', (e) => {
        state.soundEnabled = !state.soundEnabled;
        e.currentTarget.classList.toggle('active', state.soundEnabled);
        showToast(state.soundEnabled ? '🔊 Counter sound unmuted' : '🔇 Counter sound muted');
      });
      document.getElementById('hapticToggleBtn').addEventListener('click', (e) => {
        state.hapticEnabled = !state.hapticEnabled;
        e.currentTarget.classList.toggle('active', state.hapticEnabled);
        showToast(state.hapticEnabled ? '📳 Vibration enabled' : '📴 Vibration disabled');
      });
      document.getElementById('resetTriggerBtn').addEventListener('click', () => openSheetForState('31'));
      document.getElementById('historyTriggerBtn').addEventListener('click', () => openSheetForState('35'));

      // Close sheet when clicking backdrop outside sheet
      document.getElementById('sheetBackdrop').addEventListener('click', (e) => {
        if (e.target.id === 'sheetBackdrop') closeSheet();
      });

      // Developer Toolbar Background Switcher
      const bgSelect = document.getElementById('bgSelector');
      const bgFile = document.getElementById('bgFileInput');
      bgSelect.addEventListener('change', (e) => {
        if (e.target.value === 'custom-upload') {
          bgFile.click();
        } else {
          applyBackground(e.target.value);
        }
      });
      bgFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => applyBackground(null, ev.target.result);
        reader.readAsDataURL(file);
      });

      // Developer Toolbar State Switcher (Screens 21–36)
      document.getElementById('stateSelector').addEventListener('change', (e) => {
        openSheetForState(e.target.value);
      });
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Duas Library — Cloud Admin & Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=Lateef:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    (function syncAamaalGlobalPrefs() {
      try {
        const prefs = JSON.parse(localStorage.getItem('aamaal_global_prefs') || '{}');
        const root = document.documentElement;
        if (prefs.theme) {
          root.setAttribute('data-theme', prefs.theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'parchment' : 'emerald')
            : prefs.theme);
        }
        if (prefs.arabicScale) root.style.setProperty('--arabic-scale', prefs.arabicScale);
        if (prefs.bodyScale) root.style.setProperty('--body-scale', prefs.bodyScale);
        if (prefs.reducedMotion !== undefined) root.setAttribute('data-reduced-motion', String(prefs.reducedMotion));
      } catch (e) {}
    })();
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project-id.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project-id.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    Object.assign(window, { db: getFirestore(app), doc, getDoc, setDoc });
  </script>
  <style>
    :root {
      --bg-deep: #041612; --bg-surface: #09221c; --bg-card: rgba(13, 40, 33, 0.82);
      --bg-card-hover: rgba(20, 56, 46, 0.92); --bg-parchment: #f4ebd9;
      --parchment-text: #1c2b24; --gold-primary: #d4af37; --gold-light: #f3dc8b;
      --gold-muted: rgba(212, 175, 55, 0.28); --gold-border: rgba(212, 175, 55, 0.22);
      --emerald-accent: #18614c; --emerald-pill: #134e3d; --text-main: #f0f5f3;
      --text-muted: #9ab0a7; --text-dim: #647d74; --arabic-scale: 1;
      --body-scale: 1; --arabic-font: 'Amiri', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: #020c0a radial-gradient(circle at 15% 15%, rgba(24, 97, 76, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
      color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100%; overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch; touch-action: pan-y;
    }
    body { display: flex; flex-direction: column; align-items: center; }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .phone-frame {
      width: 100%; max-width: 412px; min-height: 100vh; margin: 0 auto;
      background: var(--bg-deep); border-inline: 1px solid rgba(212, 175, 55, 0.25);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85); position: relative; display: flex; flex-direction: column;
    }
    @media (max-width: 440px) { .phone-frame { border: none; max-width: 100%; } }

    .app-viewport { flex: 1; width: 100%; position: relative; padding-bottom: 36px; }

    /* Core UI Elements */
    .hero-banner { position: relative; padding: 18px 20px 22px; background: center/cover no-repeat; border-bottom: 1px solid var(--gold-border); }
    .hero-banner::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 22, 18, 0.45) 0%, rgba(4, 22, 18, 0.88) 75%, var(--bg-deep) 100%); z-index: 1; pointer-events: none; }
    .hero-content { position: relative; z-index: 2; }
    .top-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    
    .back-btn, .icon-action-btn { width: 34px; height: 34px; border-radius: 50%; background: rgba(9, 34, 28, 0.75); border: 1px solid var(--gold-border); color: var(--gold-light); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
    .back-btn:hover, .icon-action-btn:hover { border-color: var(--gold-primary); background: rgba(24, 97, 76, 0.6); }
    
    .admin-pill-btn { height: 34px; padding: 0 12px; border-radius: 99px; background: rgba(24, 97, 76, 0.75); border: 1px solid var(--gold-primary); color: var(--gold-light); display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .admin-pill-btn:hover { background: var(--emerald-accent); box-shadow: 0 0 10px rgba(212, 175, 55, 0.25); }

    .page-title { font-family: 'Cinzel', serif; font-size: 1.45rem; font-weight: 600; color: var(--gold-light); letter-spacing: 0.3px; }
    .page-subtitle { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }

    .search-bar-wrap { position: relative; margin: 14px 0; }
    .search-input { width: 100%; background: rgba(9, 34, 28, 0.85); border: 1px solid var(--gold-border); border-radius: 99px; padding: 11px 38px 11px 40px; color: var(--text-main); font-size: 0.86rem; outline: none; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--gold-primary); box-shadow: 0 0 12px rgba(212, 175, 55, 0.18); }
    .search-icon, .clear-search-btn { position: absolute; top: 50%; transform: translateY(-50%); }
    .search-icon { left: 15px; color: var(--gold-primary); font-size: 0.9rem; pointer-events: none; }
    .clear-search-btn { right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; }

    /* Featured Slide */
    .featured-slide-wrap { position: relative; margin: 6px 0 20px; }
    .market-featured-card { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid rgba(212, 175, 55, 0.45); cursor: pointer; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45); transition: transform 0.25s, border-color 0.25s; background: center/cover no-repeat; padding: 18px 18px 28px; display: flex; justify-content: flex-end; min-height: 132px; align-items: center; }
    .market-featured-card:hover { transform: translateY(-2px); border-color: var(--gold-primary); }
    .market-card-badge { position: absolute; top: 10px; left: 12px; background: rgba(4, 22, 18, 0.82); border: 1px solid var(--gold-border); color: var(--gold-light); font-size: 0.65rem; padding: 3px 8px; border-radius: 99px; backdrop-filter: blur(4px); }
    .market-card-info { max-width: 65%; text-align: left; }
    .market-card-title { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--gold-light); font-weight: 600; margin-bottom: 4px; }
    .market-card-desc { font-size: 0.76rem; color: var(--text-main); opacity: 0.9; margin-bottom: 8px; }
    .market-card-link { font-size: 0.73rem; color: var(--gold-primary); display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .slide-controls-bar { position: absolute; bottom: 8px; inset-inline: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .slide-dots, .slide-arrows { display: flex; gap: 5px; pointer-events: auto; }
    .slide-dot { width: 7px; height: 7px; border-radius: 99px; background: rgba(255, 255, 255, 0.35); border: none; cursor: pointer; transition: all 0.2s; }
    .slide-dot.active { width: 18px; background: var(--gold-primary); }
    .slide-arrow-btn { width: 22px; height: 22px; border-radius: 50%; background: rgba(4, 22, 18, 0.8); border: 1px solid var(--gold-border); color: var(--gold-light); font-size: 0.7rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    /* Sections & Categories */
    .section-head { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 12px; }
    .section-title { font-family: 'Cinzel', serif; font-size: 0.98rem; color: var(--gold-light); font-weight: 600; }
    .section-action { font-size: 0.76rem; color: var(--gold-primary); cursor: pointer; background: none; border: none; }
    .quick-cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .quick-cat-tile { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 16px; padding: 12px 6px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .quick-cat-tile:hover { background: var(--bg-card-hover); border-color: var(--gold-primary); transform: translateY(-2px); }
    .quick-cat-icon { width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, rgba(13, 40, 33, 0.9) 100%); border: 1px solid var(--gold-primary); display: flex; align-items: center; justify-content: center; color: var(--gold-light); font-size: 1.05rem; }
    .quick-cat-label { font-size: 0.7rem; color: var(--text-main); line-height: 1.25; font-weight: 500; }
    .quick-cat-count { font-size: 0.62rem; color: var(--gold-primary); }

    /* Cards & Lists */
    .list-stack, .option-list { display: flex; flex-direction: column; gap: 10px; }
    .dua-list-card { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 16px; padding: 13px 15px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; }
    .dua-list-card:hover { background: var(--bg-card-hover); border-color: var(--gold-primary); }
    .medallion-icon { width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle, rgba(24, 97, 76, 0.45) 0%, rgba(6, 24, 19, 0.95) 100%); border: 1.5px solid var(--gold-primary); display: flex; align-items: center; justify-content: center; color: var(--gold-light); font-size: 1.1rem; flex-shrink: 0; box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.25); }
    .medallion-arabic { font-family: 'Amiri', serif; font-size: 0.95rem; color: var(--gold-light); line-height: 1; }
    .card-body-text { flex: 1; min-width: 0; }
    .card-title, .card-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title { font-size: 0.92rem; font-weight: 600; color: var(--text-main); margin-bottom: 2px; }
    .card-sub { font-size: 0.76rem; color: var(--text-muted); }
    .card-meta { font-size: 0.7rem; color: var(--gold-primary); margin-top: 3px; }
    .card-chevron { color: var(--text-muted); font-size: 0.9rem; }

    .filter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 15px; border-radius: 99px; font-size: 0.76rem; border: 1px solid var(--gold-border); background: rgba(9, 34, 28, 0.7); color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .chip.active { background: var(--emerald-accent); color: var(--text-main); border-color: var(--gold-primary); font-weight: 600; }

    /* Dua Content Box & Parchment */
    .dua-content-box { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 20px; padding: 20px 18px; margin: 14px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); }
    .dua-content-box.parchment { background: linear-gradient(180deg, #f7efe0 0%, #eadbc0 100%); color: var(--parchment-text); border: 2px solid #c59b38; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(163, 119, 39, 0.22); }
    .arabic-verse { font-family: var(--arabic-font); font-size: calc(1.55rem * var(--arabic-scale)); line-height: 2.15; text-align: center; direction: rtl; color: var(--gold-light); margin-bottom: 16px; padding: 6px 4px; }
    .parchment .arabic-verse { color: #12261e; font-weight: 700; }
    .translation-text { font-size: calc(0.92rem * var(--body-scale)); line-height: 1.6; color: var(--text-main); text-align: center; margin-bottom: 14px; font-weight: 500; }
    .parchment .translation-text, .parchment .benefits-title { color: #1c2b24; }
    .source-badge { display: block; text-align: center; font-size: 0.76rem; color: var(--gold-primary); padding-top: 10px; border-top: 1px solid var(--gold-border); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
    .parchment .source-badge { color: #7d5a12; border-top-color: rgba(125, 90, 18, 0.25); font-weight: 600; }
    .benefits-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gold-border); }
    .parchment .benefits-section { border-top-color: rgba(125, 90, 18, 0.25); }
    .benefits-title { font-size: 0.82rem; font-weight: 700; color: var(--gold-light); margin-bottom: 6px; }
    .benefits-list { padding-left: 18px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.5; }
    .parchment .benefits-list { color: #2f4238; }

    /* Toolbars & Buttons */
    .dua-toolbar-strip { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 12px; }
    .mini-tool-btn { flex: 1; background: rgba(13, 40, 33, 0.85); border: 1px solid var(--gold-border); color: var(--gold-light); padding: 8px 6px; border-radius: 12px; font-size: 0.72rem; display: flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; transition: all 0.2s; }
    .mini-tool-btn:hover { border-color: var(--gold-primary); background: var(--bg-card-hover); }
    .dual-action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .action-pill-btn { background: rgba(13, 40, 33, 0.9); border: 1px solid var(--gold-primary); color: var(--text-main); padding: 11px 16px; border-radius: 14px; font-size: 0.84rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all 0.2s; }
    .action-pill-btn:hover, .action-pill-btn.active { background: var(--emerald-accent); color: var(--gold-light); }

    /* Audio Player */
    .audio-card { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 20px; padding: 18px; margin-bottom: 18px; }
    .reciter-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .reciter-avatar { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--gold-primary); background: #14382e; display: flex; align-items: center; justify-content: center; color: var(--gold-light); font-size: 1.3rem; flex-shrink: 0; }
    .progress-track { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.14); border-radius: 99px; position: relative; margin-bottom: 8px; cursor: pointer; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--gold-primary), var(--gold-light)); border-radius: 99px; position: relative; transition: width 0.12s linear; }
    .progress-knob { width: 13px; height: 13px; border-radius: 50%; background: var(--gold-light); box-shadow: 0 0 10px var(--gold-primary); position: absolute; right: -6px; top: 50%; transform: translateY(-50%); }
    .time-row { display: flex; justify-content: space-between; font-size: 0.74rem; color: var(--text-muted); margin-bottom: 14px; }
    .player-controls { display: flex; justify-content: center; align-items: center; gap: 28px; }
    .play-main-btn { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle, #21785e 0%, #0f3d2f 100%); border: 2px solid var(--gold-primary); color: var(--gold-light); font-size: 1.4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 18px rgba(212, 175, 55, 0.3); }
    .audio-fallback-alert { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(180, 48, 48, 0.18); border: 1px solid rgba(235, 110, 95, 0.55); color: #ffd7d2; font-size: 0.76rem; line-height: 1.45; }
    .audio-fallback-actions { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
    .fallback-pill-btn { background: rgba(212, 175, 55, 0.2); border: 1px solid var(--gold-primary); color: var(--gold-light); border-radius: 99px; padding: 5px 11px; font-size: 0.7rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }

    /* Options & Controls */
    .option-row { background: var(--bg-card); border: 1px solid var(--gold-border); border-radius: 14px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s; }
    .option-row.selected { border-color: var(--gold-primary); background: rgba(24, 97, 76, 0.35); }
    .radio-left { display: flex; align-items: center; gap: 12px; font-size: 0.86rem; }
    .radio-circle { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--gold-primary); display: flex; align-items: center; justify-content: center; }
    .option-row.selected .radio-circle::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-light); }
    .size-btn-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 10px 0 18px; }
    .size-btn { background: var(--bg-card); border: 1px solid var(--gold-border); color: var(--text-main); padding: 10px; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .size-btn.active { background: var(--emerald-accent); border-color: var(--gold-primary); color: var(--gold-light); }
    .primary-cta-btn { width: 100%; background: linear-gradient(135deg, #1f6b55 0%, #104233 100%); border: 1px solid var(--gold-primary); color: var(--text-main); font-weight: 600; padding: 13px; border-radius: 99px; font-size: 0.9rem; cursor: pointer; margin-top: 18px; transition: all 0.2s; }
    .primary-cta-btn:hover { box-shadow: 0 0 16px rgba(212, 175, 55, 0.3); color: var(--gold-light); }
    .secondary-cta-btn { width: 100%; background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-light); font-weight: 600; padding: 13px; border-radius: 99px; font-size: 0.9rem; cursor: pointer; margin-top: 8px; transition: all 0.2s; }

    /* Share, Modals & Empty States */
    .share-preview-card { border-radius: 22px; overflow: hidden; border: 1.5px solid var(--gold-primary); background: #f4ebd9; color: #1c2b24; box-shadow: 0 16px 36px rgba(0,0,0,0.6); margin: 10px 0 22px; }
    .share-card-art { height: 115px; background: center/cover no-repeat; position: relative; }
    .share-card-body { padding: 18px 16px; text-align: center; }
    .share-social-row { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }
    .social-circle { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-muted); cursor: pointer; }
    .social-circle-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #fff; border: 1px solid var(--gold-border); }
    .copy-sheet { background: #f5eedc; color: #1a2922; border-radius: 24px; padding: 20px 18px; border: 2px solid var(--gold-primary); margin-top: 20px; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.7); }
    .copy-check-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid rgba(0,0,0,0.08); cursor: pointer; font-weight: 500; font-size: 0.9rem; }
    .empty-state-box { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .empty-illustration { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(24, 97, 76, 0.35) 0%, rgba(9, 34, 28, 0.9) 75%); border: 1.5px solid var(--gold-border); display: flex; align-items: center; justify-content: center; font-size: 2.6rem; color: var(--gold-primary); margin-bottom: 16px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.12); }

    /* Admin Tabs & Form */
    .admin-tab-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; background: rgba(9, 34, 28, 0.85); padding: 5px; border-radius: 14px; border: 1px solid var(--gold-border); }
    .admin-tab-btn { background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.78rem; padding: 9px 8px; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .admin-tab-btn.active { background: var(--emerald-accent); color: var(--gold-light); border: 1px solid var(--gold-primary); }
    .admin-form-group { margin-bottom: 12px; }
    .admin-label { display: block; font-size: 0.76rem; color: var(--gold-light); margin-bottom: 5px; font-weight: 600; }
    .admin-input, .admin-select, .admin-textarea { width: 100%; background: rgba(9, 34, 28, 0.9); border: 1px solid var(--gold-border); border-radius: 12px; padding: 10px 12px; color: var(--text-main); font-size: 0.84rem; font-family: inherit; outline: none; }
    .admin-textarea { min-height: 70px; resize: vertical; }
    .admin-input:focus, .admin-select:focus, .admin-textarea:focus { border-color: var(--gold-primary); }
    .icon-picker-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
    .icon-pick-btn { background: rgba(9, 34, 28, 0.9); border: 1px solid var(--gold-border); color: var(--gold-light); border-radius: 10px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
    .icon-pick-btn.selected, .icon-pick-btn:hover { background: var(--emerald-accent); border-color: var(--gold-primary); }
    .toast-msg { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); background: rgba(212, 175, 55, 0.95); color: #041612; font-weight: 700; font-size: 0.78rem; padding: 8px 18px; border-radius: 99px; opacity: 0; pointer-events: none; transition: all 0.25s ease; z-index: 200; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    .toast-msg.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>

  <main class="phone-frame">
    <audio id="duaAudioElement" preload="metadata" crossorigin="anonymous"></audio>
    <div class="app-viewport" id="appViewport">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;color:var(--gold-primary);">
        <i class="bi bi-hourglass-split" style="font-size:2rem;margin-bottom:12px;animation:pulse 1.5s infinite;"></i>
        <div style="font-family:'Cinzel',serif;font-weight:600;">Loading Duas from Cloud...</div>
      </div>
    </div>
    <div class="toast-msg" id="toastMsg">Saved to Cloud</div>
  </main>

  <script>
    /* ==========================================================================
       1. FIREBASE DATA REPOSITORY
       ========================================================================== */
    const IMG_DESERT = 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=800&q=80';
    const IMG_SUNRISE = 'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80';
    const IMG_MARKET = 'https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80';

    const RECITER_STREAMS = {
      'Sheikh Mishary Rashid Alafasy': 'https://everyayah.com/data/Alafasy_128kbps/001001.mp3',
      'Sheikh Abdul Basit Abdul Samad': 'https://everyayah.com/data/Abdul_Basit_Murattal_192kbps/001001.mp3',
      'Sheikh Abdur-Rahman As-Sudais': 'https://everyayah.com/data/Abdurrahmaan_As-Sudais_192kbps/001001.mp3'
    };

    const PRESET_ICONS = [
      'bi-sun', 'bi-sunrise', 'bi-shield-check', 'bi-heart-pulse', 'bi-moon-stars', 'bi-compass',
      'bi-cup-hot', 'bi-cloud-moon', 'bi-door-open', 'bi-house-heart', 'bi-building', 'bi-cloud-rain',
      'bi-bandaid', 'bi-people', 'bi-lightbulb', 'bi-shop', 'bi-journal-bookmark', 'bi-award'
    ];

    let DUA_CATEGORIES = [];
    let DUAS_LIST = [];

    async function saveRepository() {
      try {
        await window.setDoc(window.doc(window.db, "aamaalApp", "libraryData"), {
          categories: DUA_CATEGORIES,
          duas: DUAS_LIST
        });
      } catch (error) {
        console.error("Error saving to Firebase: ", error);
        showToast("Failed to save to cloud");
      }
    }

    function getCategoryDuaCount(catId) {
      return DUAS_LIST.filter(d => d.category === catId || d.grouping === catId).length;
    }

    /* ==========================================================================
       2. STATE & AUDIO ENGINE
       ========================================================================== */
    let state = {
      currentScreen: 37,
      previousScreen: 37,
      adminTab: 'categories', // 'categories' or 'duas'
      editingCategoryId: null,
      selectedCategoryId: null,
      selectedDuaId: null,
      editingDuaId: null,
      featuredSlideIndex: 0,
      searchQuery: '',
      searchFilter: 'All',
      favourites: [],
      favTab: 'Duas',
      isPlaying: false,
      audioCurrentTime: 0,
      audioDuration: 0,
      audioProgressPct: 0,
      audioError: false,
      audioErrorMessage: '',
      usingSpeechFallback: false,
      selectedReciter: 'Sheikh Mishary Rashid Alafasy',
      language: 'English',
      fontSize: 'medium',
      arabicStyle: 'Uthmani (Classic)',
      copyOptions: { arabic: true, translation: true }
    };

    const $ = id => document.getElementById(id);

    function formatSeconds(sec) {
      if (!sec || isNaN(sec) || !isFinite(sec)) return '0:00';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function getAudioElement() { return $('duaAudioElement'); }

    function resolveAudioSource(dua) {
      if (!dua) return '';
      if (state.selectedReciter !== 'Sheikh Mishary Rashid Alafasy' && RECITER_STREAMS[state.selectedReciter]) {
        return RECITER_STREAMS[state.selectedReciter];
      }
      return dua.audioUrl || RECITER_STREAMS['Sheikh Mishary Rashid Alafasy'];
    }

    function setupAudioListeners() {
      const audio = getAudioElement();
      if (!audio) return;
      audio.addEventListener('loadedmetadata', () => { state.audioDuration = audio.duration || 0; state.audioError = false; state.audioErrorMessage = ''; updateAudioPlayerDOM(); });
      audio.addEventListener('timeupdate', () => { state.audioCurrentTime = audio.currentTime || 0; if (audio.duration && isFinite(audio.duration)) { state.audioDuration = audio.duration; state.audioProgressPct = Math.min(100, Math.round((audio.currentTime / audio.duration) * 100)); } updateAudioPlayerDOM(); });
      audio.addEventListener('play', () => { state.isPlaying = true; state.audioError = false; updateAudioPlayerDOM(); });
      audio.addEventListener('pause', () => { state.isPlaying = false; updateAudioPlayerDOM(); });
      audio.addEventListener('ended', () => { state.isPlaying = false; state.audioProgressPct = 100; updateAudioPlayerDOM(); });
      audio.addEventListener('error', () => { state.isPlaying = false; state.audioError = true; state.audioErrorMessage = 'Audio stream unavailable or failed to load.'; showToast('Audio playback error — fallback ready'); if (state.currentScreen === 46) renderScreen(46); });
    }

    function updateAudioPlayerDOM() {
      if (state.currentScreen !== 46) return;
      const fillEl = $('audioProgressFill'), timeCurEl = $('audioCurrentTimeLabel'), timeDurEl = $('audioDurationLabel'), playIconEl = $('audioPlayIcon');
      const dua = getDua(state.selectedDuaId);
      const durText = state.audioDuration ? formatSeconds(state.audioDuration) : (dua?.duration || '0:00');
      if (fillEl) fillEl.style.width = `${state.audioProgressPct}%`;
      if (timeCurEl) timeCurEl.textContent = `${formatSeconds(state.audioCurrentTime)} / ${durText}`;
      if (timeDurEl) timeDurEl.textContent = durText;
      if (playIconEl) playIconEl.className = `bi ${state.isPlaying ? 'bi-pause-fill' : 'bi-play-fill'}`;
    }

    function toggleAudioPlayback() {
      const audio = getAudioElement();
      const dua = getDua(state.selectedDuaId);
      if (!audio || !dua) return;
      if (window.speechSynthesis?.speaking) { window.speechSynthesis.cancel(); state.usingSpeechFallback = false; }
      const targetSrc = resolveAudioSource(dua);
      if (audio.src !== targetSrc) audio.src = targetSrc;
      if (state.isPlaying) { audio.pause(); } else { audio.play()?.catch(() => { state.isPlaying = false; state.audioError = true; state.audioErrorMessage = 'Unable to stream recitation audio.'; renderScreen(46); }); }
    }

    function seekAudioTrack(event) {
      const audio = getAudioElement();
      const rect = event.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(event.clientX - rect.left, rect.width)) / rect.width;
      state.audioProgressPct = Math.round(pct * 100);
      if (audio && audio.duration && isFinite(audio.duration)) { audio.currentTime = state.audioCurrentTime = pct * audio.duration; }
      updateAudioPlayerDOM();
    }

    function rewindAudio() {
      const audio = getAudioElement();
      if (audio) audio.currentTime = state.audioCurrentTime = state.audioProgressPct = 0;
      updateAudioPlayerDOM(); showToast('Rewound to start');
    }

    function nextDuaAudio() {
      if (DUAS_LIST.length === 0) return;
      const nextIdx = (DUAS_LIST.findIndex(d => d.id === state.selectedDuaId) + 1) % DUAS_LIST.length;
      const nextDua = DUAS_LIST[nextIdx];
      state.selectedDuaId = nextDua.id;
      const audio = getAudioElement();
      if (audio) { audio.pause(); audio.src = resolveAudioSource(nextDua); state.audioCurrentTime = state.audioProgressPct = 0; state.isPlaying = false; }
      renderScreen(46); showToast(`Switched to ${nextDua.title}`);
    }

    function selectReciterOption(reciterName) {
      state.selectedReciter = reciterName; state.audioError = false; state.audioErrorMessage = '';
      const audio = getAudioElement();
      if (audio) {
        const wasPlaying = state.isPlaying; audio.pause(); audio.src = resolveAudioSource(getDua(state.selectedDuaId)); audio.load();
        state.audioCurrentTime = state.audioProgressPct = 0;
        if (wasPlaying) audio.play()?.catch(() => { state.audioError = true; renderScreen(46); });
      }
      renderScreen(46);
    }

    function simulateAudioFailure() {
      const audio = getAudioElement();
      if (audio) { audio.pause(); audio.src = 'https://invalid.domain.local/nonexistent.mp3'; audio.load(); }
    }

    function retryAudioStream() {
      state.audioError = false; state.audioErrorMessage = '';
      const audio = getAudioElement();
      if (audio) { audio.src = resolveAudioSource(getDua(state.selectedDuaId)); audio.load(); audio.play()?.catch(() => { state.audioError = true; renderScreen(46); }); }
      renderScreen(46);
    }

    function playOfflineSpeechFallback() {
      const dua = getDua(state.selectedDuaId);
      if (!dua) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(dua.arabic);
        utter.lang = 'ar-SA'; utter.rate = 0.85;
        utter.onstart = () => { state.isPlaying = state.usingSpeechFallback = true; updateAudioPlayerDOM(); };
        utter.onend = () => { state.isPlaying = state.usingSpeechFallback = false; state.audioProgressPct = 100; updateAudioPlayerDOM(); };
        window.speechSynthesis.speak(utter);
        showToast('Playing offline Arabic voice fallback');
      } else { showToast('Offline speech synthesis not supported'); }
    }

    function showToast(msg) {
      const t = $('toastMsg'); t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function getDua(id) {
      if (DUAS_LIST.length === 0) return null;
      return DUAS_LIST.find(d => d.id === id) || DUAS_LIST[0];
    }

    function toggleBookmark(duaId) {
      const idx = state.favourites.indexOf(duaId);
      if (idx > -1) { state.favourites.splice(idx, 1); showToast('Removed from Favourites'); } 
      else { state.favourites.push(duaId); showToast('Saved to Favourites'); }
      renderScreen(state.currentScreen);
    }

    function getTranslationText(dua) {
      if (!dua) return '';
      if (state.language === 'Urdu') return dua.urduTranslation || dua.translation;
      if (state.language === 'Roman Urdu') return dua.romanUrduTranslation || dua.translation;
      if (state.language === 'Hindi') return dua.hindiTranslation || dua.translation;
      return dua.translation;
    }

    function renderDuaCardHTML(d, showSource = true) {
      if (!d) return '';
      return `
        <div class="dua-list-card" onclick="openDuaDetail('${d.id}')">
          <div class="medallion-icon"><span class="medallion-arabic">${d.arabicMedallion || 'دعا'}</span></div>
          <div class="card-body-text">
            <div class="card-title">${d.title}</div>
            <div class="card-sub">${d.subtitle}</div>
            ${showSource && d.source ? `<div class="card-meta">${d.source}</div>` : ''}
          </div>
          <i class="bi bi-chevron-right card-chevron"></i>
        </div>`;
    }

    function renderDualActionsHTML(duaId, savedText = 'Bookmark') {
      const isFav = state.favourites.includes(duaId);
      return `
        <div class="dual-action-row">
          <button class="action-pill-btn ${isFav ? 'active' : ''}" onclick="toggleBookmark('${duaId}')">
            <i class="bi ${isFav ? 'bi-bookmark-fill' : 'bi-bookmark'}"></i>
            <span>${isFav ? savedText : 'Bookmark'}</span>
          </button>
          <button class="action-pill-btn" onclick="renderScreen(50)">
            <i class="bi bi-share"></i>
            <span>Share</span>
          </button>
        </div>`;
    }

    /* ==========================================================================
       3. MASTER SCREEN ROUTER
       ========================================================================== */
    const VIEWS = {
      37: () => view37Home(),
      38: () => view38Categories(),
      39: () => view39CategoryDetail(),
      40: () => view40Search(state.searchQuery),
      41: () => view40Search('travel'),
      42: () => view42DetailStandard(),
      43: () => view43DetailIllustrated(),
      44: () => view44Marketplace(),
      45: () => view45FocusMode(),
      46: () => view46AudioPlayer(),
      47: () => view47Language(),
      48: () => view48FontSettings(),
      49: () => view49Favourites(),
      50: () => view50Share(),
      51: () => view51CopyModal(),
      52: () => view52SourceRef(),
      54: () => view54NoMatches(),
      99: () => view99AdminModal(),
      100: () => view100EditDuaModal()
    };

    function renderScreen(screenNum, customDuaId = null, preserveSlide = false, fromHistory = false) {
      const isSameScreen = (screenNum === state.currentScreen);
      if (!isSameScreen) state.previousScreen = state.currentScreen;
      state.currentScreen = screenNum;
      if (customDuaId) state.selectedDuaId = customDuaId;
      else if (!state.selectedDuaId && DUAS_LIST.length > 0) state.selectedDuaId = DUAS_LIST[0].id;

      if (!fromHistory) window.history.pushState({ screen: screenNum, duaId: state.selectedDuaId }, '', '');
      if (screenNum === 37 && !preserveSlide && DUAS_LIST.length > 0) state.featuredSlideIndex = (state.featuredSlideIndex + 1) % DUAS_LIST.length;
      if (!isSameScreen && !preserveSlide) window.scrollTo(0, 0);

      $('appViewport').innerHTML = (VIEWS[screenNum] || VIEWS[37])();
    }

    function openAdminTab(tabName, editCatId = null) {
      state.adminTab = tabName;
      state.editingCategoryId = editCatId;
      renderScreen(99, null, true);
    }

    /* --- SCREEN 37: Dua Library Home --- */
    function view37Home() {
      const quickCats = DUA_CATEGORIES.filter(c => c.group === 'core').slice(0, 4);
      const futureGroupingsCount = DUA_CATEGORIES.filter(c => c.group === 'future').length;
      const hasDuas = DUAS_LIST.length > 0;
      const slideIdx = hasDuas ? Math.max(0, state.featuredSlideIndex % DUAS_LIST.length) : 0;
      const featuredDua = hasDuas ? DUAS_LIST[slideIdx] : null;

      return `
        <div class="hero-banner" style="background-image:url('${IMG_DESERT}');">
          <div class="hero-content">
            <div class="top-nav-row">
              <button class="back-btn" onclick="window.location.href='home.html'" title="Back to Home"><i class="bi bi-chevron-left"></i></button>
              <div style="display:flex;gap:8px;">
                <button class="admin-pill-btn" onclick="openAdminTab('categories')" title="Manage Categories & Duas"><i class="bi bi-sliders"></i> Admin</button>
                <button class="icon-action-btn" onclick="renderScreen(49)" title="Favourites"><i class="bi bi-bookmark-heart"></i></button>
              </div>
            </div>
            <h1 class="page-title">Duas</h1>
            <p class="page-subtitle">A collection of authentic duas for everyday life</p>
            <div class="search-bar-wrap" onclick="state.searchQuery='';renderScreen(40);">
              <i class="bi bi-search search-icon"></i>
              <input type="text" class="search-input" placeholder="Search duas by title, occasion, or Arabic..." readonly />
            </div>
          </div>
        </div>

        <div style="padding:14px 18px;">
          ${hasDuas && featuredDua ? `
          <div class="featured-slide-wrap">
            <div class="market-featured-card" style="background-image:linear-gradient(90deg,rgba(8,28,22,0.35) 0%,rgba(8,28,22,0.88) 52%,rgba(8,28,22,0.96) 100%),url('${featuredDua.heroImg || IMG_DESERT}');" onclick="openDuaDetail('${featuredDua.id}')">
              <span class="market-card-badge"><i class="bi bi-stars"></i> Featured (${slideIdx + 1}/${DUAS_LIST.length})</span>
              <div class="market-card-info">
                <div class="market-card-title">${featuredDua.title}</div>
                <div class="market-card-desc">${featuredDua.subtitle}</div>
                <span class="market-card-link">(Tap to read full dua) <i class="bi bi-arrow-right-short"></i></span>
              </div>
            </div>
            <div class="slide-controls-bar">
              <div class="slide-dots">
                ${DUAS_LIST.slice(0, 8).map((_, idx) => `<button class="slide-dot ${idx === slideIdx ? 'active' : ''}" onclick="event.stopPropagation();setFeaturedSlide(${idx});"></button>`).join('')}
              </div>
              <div class="slide-arrows">
                <button class="slide-arrow-btn" onclick="event.stopPropagation();stepFeaturedSlide(-1);" title="Previous Dua"><i class="bi bi-chevron-left"></i></button>
                <button class="slide-arrow-btn" onclick="event.stopPropagation();stepFeaturedSlide(1);" title="Next Dua"><i class="bi bi-chevron-right"></i></button>
              </div>
            </div>
          </div>
          ` : ''}

          <div class="section-head">
            <span class="section-title">Browse by Category</span>
            <button class="section-action" onclick="renderScreen(38)">View all (${futureGroupingsCount} groupings) <i class="bi bi-chevron-right"></i></button>
          </div>

          ${quickCats.length > 0 ? `
            <div class="quick-cat-grid">
              ${quickCats.map(c => {
                const liveCount = getCategoryDuaCount(c.id);
                const words = c.title.split(' ');
                return `
                  <div class="quick-cat-tile" onclick="openCategory('${c.id}')">
                    <div class="quick-cat-icon"><i class="bi ${c.icon || 'bi-sun'}"></i></div>
                    <span class="quick-cat-label">${words[0]}<br>${words.slice(1).join(' ') || ''}</span>
                    <span class="quick-cat-count">${liveCount} ${liveCount === 1 ? 'dua' : 'duas'}</span>
                  </div>`;
              }).join('')}
            </div>
          ` : `
            <div class="dua-content-box" style="text-align:center;padding:18px;">
              <div style="font-size:0.84rem;color:var(--gold-light);font-weight:600;margin-bottom:4px;">Step 1: Add Categories & Groupings</div>
              <p class="card-sub" style="white-space:normal;">No categories in cloud yet. Add your categories & groupings first so they populate the Dua dropdowns.</p>
              <button class="primary-cta-btn" style="margin-top:12px;padding:10px;" onclick="openAdminTab('categories')">+ Add Categories & Groupings</button>
            </div>
          `}

          <div class="section-head">
            <span class="section-title">Essential Supplications</span>
            <button class="section-action" onclick="state.searchQuery='';renderScreen(40);">View all (${DUAS_LIST.length})</button>
          </div>

          ${hasDuas ? `
            <div class="list-stack">
              ${DUAS_LIST.slice(0, 4).map(d => renderDuaCardHTML(d)).join('')}
            </div>
          ` : `
            <div class="dua-content-box" style="text-align:center;padding:18px;">
              <div style="font-size:0.84rem;color:var(--gold-light);font-weight:600;margin-bottom:4px;">Step 2: Add Duas</div>
              <p class="card-sub" style="white-space:normal;">Once your categories and groupings are created, add duas and assign them.</p>
              <button class="primary-cta-btn" style="margin-top:12px;padding:10px;" onclick="openAdminTab('duas')">+ Add First Dua</button>
            </div>
          `}
        </div>`;
    }

    function setFeaturedSlide(idx) {
      state.featuredSlideIndex = idx;
      renderScreen(37, null, true);
    }

    function stepFeaturedSlide(dir) {
      if(DUAS_LIST.length === 0) return;
      state.featuredSlideIndex = (state.featuredSlideIndex + dir + DUAS_LIST.length) % DUAS_LIST.length;
      renderScreen(37, null, true);
    }

    /* --- SCREEN 38: Dua Categories --- */
    function view38Categories() {
      const coreCats = DUA_CATEGORIES.filter(c => c.group === 'core');
      const futureCats = DUA_CATEGORIES.filter(c => c.group === 'future');
      const renderCatRow = (c, prefix = '') => {
        const count = getCategoryDuaCount(c.id);
        return `
          <div class="dua-list-card category-item" data-title="${c.title.toLowerCase()}" onclick="openCategory('${c.id}')">
            <div class="medallion-icon"><i class="bi ${c.icon || 'bi-sun'}"></i></div>
            <div class="card-body-text">
              <div class="card-title">${prefix}${c.title}</div>
              <div class="card-sub">${c.subtitle}</div>
              <div class="card-meta">${count} ${count === 1 ? 'dua' : 'duas'}</div>
            </div>
            <button class="icon-action-btn" style="width:28px;height:28px;font-size:0.75rem;" onclick="event.stopPropagation();openAdminTab('categories','${c.id}');" title="Edit Category"><i class="bi bi-pencil"></i></button>
            <i class="bi bi-chevron-right card-chevron"></i>
          </div>`;
      };

      return `
        <div style="padding:16px 18px;">
          <div class="top-nav-row">
            <button class="back-btn" onclick="renderScreen(37)"><i class="bi bi-chevron-left"></i></button>
            <h1 class="page-title" style="font-size:1.25rem;">Dua Categories</h1>
            <button class="admin-pill-btn" onclick="openAdminTab('categories')"><i class="bi bi-plus-lg"></i> Add</button>
          </div>

          <div class="search-bar-wrap">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" placeholder="Search collections & groupings..." oninput="filterCategoryList(this.value)" />
          </div>

          <div class="section-head" style="margin-top:8px;">
            <span class="section-title">Primary Collections (${coreCats.length})</span>
            <span style="font-size:0.72rem;color:var(--text-muted);">Live counts</span>
          </div>
          <div class="list-stack" id="coreCategoryStack">
            ${coreCats.length ? coreCats.map(c => renderCatRow(c)).join('') : `<div class="card-sub">No Primary Collections yet. Tap + Add above.</div>`}
          </div>

          <div class="section-head" style="margin-top:22px;">
            <span class="section-title">All Occasions & Sunnah Groupings</span>
            <span style="font-size:0.72rem;color:var(--gold-primary);">${futureCats.length} Groupings</span>
          </div>
          <div class="list-stack" id="futureCategoryStack">
            ${futureCats.length ? futureCats.map((c, i) => renderCatRow(c, `${i + 1}. `)).join('') : `<div class="card-sub">No Occasion Groupings yet. Tap + Add above.</div>`}
          </div>
        </div>`;
    }

    function filterCategoryList(val) {
      const q = val.toLowerCase().trim();
      document.querySelectorAll('.category-item').forEach(el => { el.style.display = el.dataset.title.includes(q) ? 'flex' : 'none'; });
    }

    function openCategory(catId) {
      state.selectedCategoryId = catId; renderScreen(39);
    }

    /* --- SCREEN 39: Category Detail --- */
    function view39CategoryDetail() {
      const cat = DUA_CATEGORIES.find(c => c.id === state.selectedCategoryId) || DUA_CATEGORIES[0] || { id: '', title: 'Category', subtitle: '', icon: 'bi-sun', hero: IMG_SUNRISE };
      const categoryDuas = DUAS_LIST.filter(d => d.category === cat.id || d.grouping === cat.id);
      const count = categoryDuas.length;

      return `
        <div class="hero-banner" style="background-image:url('${cat.hero || IMG_SUNRISE}');min-height:195px;">
          <div class="hero-content">
            <div class="top-nav-row">
              <button class="back-btn" onclick="renderScreen(38)"><i class="bi bi-chevron-left"></i></button>
              <div style="display:flex;gap:8px;">
                <button class="icon-action-btn" onclick="openAdminTab('categories','${cat.id}')" title="Edit Category"><i class="bi bi-pencil"></i></button>
                <button class="admin-pill-btn" onclick="openAdminTab('duas')"><i class="bi bi-plus-circle"></i> Add Dua</button>
                <button class="icon-action-btn" onclick="state.searchQuery='';renderScreen(40);"><i class="bi bi-search"></i></button>
              </div>
            </div>
            <div style="margin-top:32px;">
              <h1 class="page-title">${cat.title}</h1>
              <p class="page-subtitle">${cat.subtitle} · <strong style="color:var(--gold-light);">${count} ${count === 1 ? 'dua' : 'duas'}</strong></p>
            </div>
          </div>
        </div>

        <div style="padding:16px 18px;">
          ${count === 0 ? `
            <div class="empty-state-box" style="padding:32px 16px;">
              <div class="empty-illustration" style="width:96px;height:96px;font-size:2.2rem;"><i class="bi ${cat.icon || 'bi-sun'}"></i></div>
              <div class="card-title">0 duas in ${cat.title} yet</div>

    function renderSearchMatchesHTML(query) {
      const q = (query || '').toLowerCase().trim();
      const matches = !q ? DUAS_LIST : DUAS_LIST.filter(d => {
        if (state.searchFilter === 'Arabic') return (d.arabic||'').includes(q);
        if (state.searchFilter === 'Translation') return (d.translation||'').toLowerCase().includes(q) || (d.romanUrduTranslation||'').toLowerCase().includes(q) || (d.urduTranslation||'').includes(q);
        return [d.title, d.subtitle, d.translation, d.romanUrduTranslation || '', d.urduTranslation || ''].some(s => (s||'').toLowerCase().includes(q)) || (d.arabic||'').includes(q);
      });

      if (!matches.length) {
        return `
          <div class="empty-state-box" style="padding:28px 10px;">
            <div class="empty-illustration" style="width:90px;height:90px;font-size:2rem;"><i class="bi bi-search"></i></div>

            <p class="card-sub" style="margin-top:6px;">Try a different keyword or add a new dua via Admin.</p>
          </div>`;
      }
      return matches.map(d => renderDuaCardHTML(d)).join('');
    }

      state.searchQuery = val;
      const box = $('searchResultsContainer');
      if (box) box.innerHTML = renderSearchMatchesHTML(val);

      if (state.copyOptions.translation) parts.push(getTranslationText(dua));
      parts.push(`Source: ${dua.source}`);
      navigator.clipboard?.writeText(parts.join('\n\n'));
      showToast('Copied selected text to clipboard!');
      setTimeout(() => renderScreen(42), 900);

    function autoFillCategoryId(titleVal) {
      if (state.editingCategoryId) return;
      const slug = titleVal.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    function saveCategoryOrGrouping(existingId = '') {
      const val = id => $(id)?.value.trim() || '';
      const group = val('catGroupType') || 'core';
      const title = val('catTitleInput');
      const id = val('catIdInput') || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const subtitle = val('catSubtitleInput') || 'Authentic supplications';
      const icon = val('catIconInput') || 'bi-sun';
      const hero = val('catHeroInput') || IMG_DESERT;

      if (!title || !id) {
        showToast('Please enter a Title and ID');
        return;
      }

      const newCatObj = { id, title, subtitle, icon, group, hero };

      if (existingId) {
        const idx = DUA_CATEGORIES.findIndex(c => c.id === existingId);
        if (idx > -1) DUA_CATEGORIES[idx] = newCatObj;
        if (existingId !== id) {
          DUAS_LIST.forEach(d => {
            if (d.category === existingId) d.category = id;
            if (d.grouping === existingId) d.grouping = id;
          });
        }
        showToast(`Updated "${title}"`);
      } else {
        const existingIdx = DUA_CATEGORIES.findIndex(c => c.id === id);
        if (existingIdx > -1) {
          DUA_CATEGORIES[existingIdx] = newCatObj;
          showToast(`Updated existing "${title}"`);
        } else {
          DUA_CATEGORIES.push(newCatObj);
          showToast(`Saved "${title}" as ${group === 'core' ? 'Category' : 'Grouping'}!`);
        }
      }

      state.editingCategoryId = null;
      state.selectedCategoryId = id;
      saveRepository();
      renderScreen(99, null, true);
    }

              <label class="admin-label">Duration (e.g. 0:45)</label>
              <input type="text" id="editDuaDuration" class="admin-input" value="${dua.duration || ''}" />
            </div>
            
            <button class="primary-cta-btn" onclick="saveEditedDua('${dua.id}')">Save Changes</button>
            <button class="secondary-cta-btn" onclick="renderScreen(42)">Cancel</button>
          </div>
        </div>`;
    }

    function updateAdminCatBgInput(catId) {
      const cat = DUA_CATEGORIES.find(c => c.id === catId);
      const input = $('adminCatBgUrl');
      if (cat && input) input.value = cat.hero || '';
    }

    function handleImageUpload(fileInput, targetInputId) {
      const file = fileInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const target = $(targetInputId);
        if (target) target.value = e.target.result;
        showToast('Image loaded!');
      };
      reader.readAsDataURL(file);
    }

    function submitAdminDua() {
      const val = id => $(id)?.value.trim() || '';
      const catId = val('adminCatSelect');
      const groupId = val('adminGroupingSelect');
      const catBgUrl = val('adminCatBgUrl');
      const title = val('adminDuaTitle');
      const subtitle = val('adminDuaSubtitle');
      const arabic = val('adminDuaArabic');
      const translation = val('adminDuaTranslation');
      const urduTranslation = val('adminDuaUrdu');
      const romanUrdu = val('adminDuaRomanUrdu');
      const hindiTranslation = val('adminDuaHindi');
      const source = val('adminDuaSource') || 'Authentic Sunnah';
      const audioUrl = val('adminDuaAudioUrl');
      const duaHeroUrl = val('adminDuaHeroUrl');
      const providedId = val('adminDuaId');
      
      const alsoMentioned = val('adminDuaAlsoMentioned').split(',').map(s => s.trim()).filter(s => s);
      const notes = val('adminDuaNotes');
      const benefits = val('adminDuaBenefits').split(',').map(s => s.trim()).filter(s => s);
      const duration = val('adminDuaDuration') || '0:00';
      const medallion = val('adminDuaMedallion') || 'دعا';

      const catObj = DUA_CATEGORIES.find(c => c.id === catId);
      if (catObj && catBgUrl) catObj.hero = catBgUrl;

      if (!title || !arabic || !translation) {
        showToast('Please fill Title, Arabic, and Translation');
        return;
      }

      DUAS_LIST.unshift({
        id: providedId || 'dua-' + Date.now(),
        title,
        subtitle: subtitle || 'Authentic Supplication',
        category: catId,
        grouping: groupId || catId,
        variants: '',
        arabicMedallion: medallion,
        illustrated: !!duaHeroUrl,
        heroImg: duaHeroUrl || catBgUrl || IMG_DESERT,
        audioUrl,
        arabic,
        translation,
        urduTranslation: urduTranslation || translation,
        romanUrduTranslation: romanUrdu || translation,
        hindiTranslation: hindiTranslation || translation,
        source,
        alsoMentioned,
        notes,
        benefits,
        duration
      });

      saveRepository();
      state.selectedCategoryId = catId || groupId;
      showToast(`Added "${title}"!`);
      renderScreen(39);
    }
    
    function saveEditedDua(originalId) {
      const val = id => $(id)?.value.trim() || '';
      const duaIndex = DUAS_LIST.findIndex(d => d.id === originalId);
      
      if (duaIndex === -1) {
        showToast('Error: Dua not found');
        return;
      }

      const updatedId = val('editDuaId');
      const title = val('editDuaTitle');
      const arabic = val('editDuaArabic');
      const translation = val('editDuaTranslation');
      
      if (!title || !arabic || !translation) {
        showToast('Please fill Title, Arabic, and Translation');
        return;
      }
      
      const alsoMentioned = val('editDuaAlsoMentioned').split(',').map(s => s.trim()).filter(s => s);
      const benefits = val('editDuaBenefits').split(',').map(s => s.trim()).filter(s => s);
      const duaHeroUrl = val('editDuaHeroUrl');

      DUAS_LIST[duaIndex] = {
        ...DUAS_LIST[duaIndex],
        id: updatedId || originalId,
        category: val('editDuaCatSelect'),
        grouping: val('editDuaGroupingSelect'),
        title: title,
        subtitle: val('editDuaSubtitle'),
        arabic: arabic,
        translation: translation,
        urduTranslation: val('editDuaUrdu'),
        romanUrduTranslation: val('editDuaRomanUrdu'),
        hindiTranslation: val('editDuaHindi'),
        source: val('editDuaSource'),
        alsoMentioned: alsoMentioned,
        notes: val('editDuaNotes'),
        benefits: benefits,
        arabicMedallion: val('editDuaMedallion') || 'دعا',
        audioUrl: val('editDuaAudioUrl'),
        heroImg: duaHeroUrl || IMG_DESERT,
        duration: val('editDuaDuration') || '0:00'
      };
      
      if (originalId !== updatedId) {
        const favIndex = state.favourites.indexOf(originalId);
        if (favIndex > -1) { state.favourites[favIndex] = updatedId; }
      }

      saveRepository();
      state.selectedDuaId = updatedId || originalId;
      showToast('Dua updated successfully!');
      renderScreen(42);
    }

    window.addEventListener('popstate', event => {
      if (event.state?.screen) { renderScreen(event.state.screen, event.state.duaId, false, true); } 
      else { renderScreen(37, null, false, true); }
    });

    window.addEventListener('DOMContentLoaded', async () => {
      setupAudioListeners();
      
      try {
        const docSnap = await window.getDoc(window.doc(window.db, "aamaalApp", "libraryData"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          DUA_CATEGORIES = data.categories || [];
          DUAS_LIST = data.duas || [];
        }
      } catch (error) {
        console.error("Error fetching data from Firebase: ", error);
        showToast("Error loading from Cloud");
      }
      
      renderScreen(37, null, false, true);
    });
  </script>
</body>
</html>

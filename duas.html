<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Duas Library — File 4 of 6</title>
  <!-- Google Fonts: Cinzel, Plus Jakarta Sans, Amiri (Uthmani/Standard), Lateef & Noto Nastaliq Urdu (IndoPak) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600;700&family=Lateef:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --bg-deep: #041612;
      --bg-surface: #09221c;
      --bg-card: rgba(13, 40, 33, 0.82);
      --bg-card-hover: rgba(20, 56, 46, 0.92);
      --bg-parchment: #f4ebd9;
      --parchment-text: #1c2b24;
      --gold-primary: #d4af37;
      --gold-light: #f3dc8b;
      --gold-muted: rgba(212, 175, 55, 0.28);
      --gold-border: rgba(212, 175, 55, 0.22);
      --emerald-accent: #18614c;
      --emerald-pill: #134e3d;
      --text-main: #f0f5f3;
      --text-muted: #9ab0a7;
      --text-dim: #647d74;
      --arabic-scale: 1;
      --body-scale: 1;
      --arabic-font: 'Amiri', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020c0a;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(24, 97, 76, 0.22) 0%, transparent 45%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.1) 0%, transparent 50%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* --- PHONE SHELL --- */
    .phone-frame {
      width: 100%;
      max-width: 412px;
      height: 860px;
      margin: 20px auto;
      background: var(--bg-deep);
      border: 2px solid rgba(212, 175, 55, 0.35);
      border-radius: 42px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 0 8px rgba(9, 34, 28, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 440px) {
      .phone-frame {
        margin: 0;
        border-radius: 0;
        border: none;
        height: 100vh;
        max-width: 100%;
      }
    }

    /* Status Bar */
    .status-bar {
      height: 36px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
      z-index: 30;
      flex-shrink: 0;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      font-size: 0.8rem;
    }

    /* Screen Container */
    .app-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 84px;
      scrollbar-width: none;
    }
    .app-viewport::-webkit-scrollbar {
      display: none;
    }

    /* --- REUSABLE UI ELEMENTS --- */
    .hero-banner {
      position: relative;
      padding: 18px 20px 22px 20px;
      background-size: cover;
      background-position: center;
      border-bottom: 1px solid var(--gold-border);
    }

    .hero-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 22, 18, 0.45) 0%, rgba(4, 22, 18, 0.88) 75%, var(--bg-deep) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .top-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .back-btn, .icon-action-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(9, 34, 28, 0.75);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .back-btn:hover, .icon-action-btn:hover {
      border-color: var(--gold-primary);
      background: rgba(24, 97, 76, 0.6);
    }

    .admin-pill-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 99px;
      background: rgba(24, 97, 76, 0.75);
      border: 1px solid var(--gold-primary);
      color: var(--gold-light);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .admin-pill-btn:hover {
      background: var(--emerald-accent);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
    }

    .page-title {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--gold-light);
      letter-spacing: 0.3px;
    }

    .page-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Search Input Bar */
    .search-bar-wrap {
      position: relative;
      margin: 14px 0;
    }

    .search-input {
      width: 100%;
      background: rgba(9, 34, 28, 0.85);
      border: 1px solid var(--gold-border);
      border-radius: 99px;
      padding: 11px 38px 11px 40px;
      color: var(--text-main);
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.18);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold-primary);
      font-size: 0.9rem;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Featured Rotating Slide Card (Screen 37) */
    .featured-slide-wrap {
      position: relative;
      margin: 6px 0 20px 0;
    }

    .market-featured-card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(212, 175, 55, 0.45);
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, border-color 0.25s ease;
      background-size: cover;
      background-position: center;
      padding: 18px 18px 28px 18px;
      display: flex;
      justify-content: flex-end;
      min-height: 132px;
      align-items: center;
    }

    .market-featured-card:hover {
      transform: translateY(-2px);
      border-color: var(--gold-primary);
    }

    .market-card-badge {
      position: absolute;
      top: 10px;
      left: 12px;
      background: rgba(4, 22, 18, 0.82);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      font-size: 0.65rem;
      padding: 3px 8px;
      border-radius: 99px;
      backdrop-filter: blur(4px);
    }

    .market-card-info {
      max-width: 65%;
      text-align: left;
    }

    .market-card-title {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--gold-light);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .market-card-desc {
      font-size: 0.76rem;
      color: var(--text-main);
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .market-card-link {
      font-size: 0.73rem;
      color: var(--gold-primary);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .slide-controls-bar {
      position: absolute;
      bottom: 8px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .slide-dots {
      display: flex;
      gap: 5px;
      pointer-events: auto;
    }

    .slide-dot {
      width: 7px;
      height: 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.35);
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .slide-dot.active {
      width: 18px;
      background: var(--gold-primary);
    }

    .slide-arrows {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .slide-arrow-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(4, 22, 18, 0.8);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Section Headers */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 12px 0;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 0.98rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .section-action {
      font-size: 0.76rem;
      color: var(--gold-primary);
      cursor: pointer;
      background: none;
      border: none;
    }

    /* 4-Column Quick Categories Row (Screen 37) */
    .quick-cat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-cat-tile {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 16px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .quick-cat-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold-primary);
      transform: translateY(-2px);
    }

    .quick-cat-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, rgba(13, 40, 33, 0.9) 100%);
      border: 1px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 1.05rem;
    }

    .quick-cat-label {
      font-size: 0.7rem;
      color: var(--text-main);
      line-height: 1.25;
      font-weight: 500;
    }

    .quick-cat-count {
      font-size: 0.62rem;
      color: var(--gold-primary);
    }

    /* List Cards (Categories & Duas) */
    .list-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dua-list-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 16px;
      padding: 13px 15px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .dua-list-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold-primary);
    }

    .medallion-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(24, 97, 76, 0.45) 0%, rgba(6, 24, 19, 0.95) 100%);
      border: 1.5px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: inset 0 0 8px rgba(212, 175, 55, 0.25);
    }

    .medallion-arabic {
      font-family: 'Amiri', serif;
      font-size: 0.95rem;
      color: var(--gold-light);
      line-height: 1;
    }

    .card-body-text {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-meta {
      font-size: 0.7rem;
      color: var(--gold-primary);
      margin-top: 3px;
    }

    .card-chevron {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Filter Chips (Screens 40, 41, 49) */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      padding: 6px 15px;
      border-radius: 99px;
      font-size: 0.76rem;
      border: 1px solid var(--gold-border);
      background: rgba(9, 34, 28, 0.7);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip.active {
      background: var(--emerald-accent);
      color: var(--text-main);
      border-color: var(--gold-primary);
      font-weight: 600;
    }

    /* --- DUA DETAIL CARD (Screens 42, 43, 44) --- */
    .dua-content-box {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 20px 18px;
      margin: 14px 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Parchment Variant for Marketplace Supplication (Screen 44) */
    .dua-content-box.parchment {
      background: linear-gradient(180deg, #f7efe0 0%, #eadbc0 100%);
      color: var(--parchment-text);
      border: 2px solid #c59b38;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6), inset 0 0 24px rgba(163, 119, 39, 0.22);
    }

    .arabic-verse {
      font-family: var(--arabic-font);
      font-size: calc(1.55rem * var(--arabic-scale));
      line-height: 2.15;
      text-align: center;
      direction: rtl;
      color: var(--gold-light);
      margin-bottom: 16px;
      padding: 6px 4px;
    }

    .parchment .arabic-verse {
      color: #12261e;
      font-weight: 700;
    }

    .transliteration-text {
      font-size: calc(0.86rem * var(--body-scale));
      line-height: 1.55;
      color: var(--text-muted);
      text-align: center;
      font-style: italic;
      margin-bottom: 14px;
    }

    .parchment .transliteration-text {
      color: #495950;
    }

    .translation-text {
      font-size: calc(0.92rem * var(--body-scale));
      line-height: 1.6;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 14px;
      font-weight: 500;
    }

    .parchment .translation-text {
      color: #1c2b24;
    }

    .source-badge {
      display: block;
      text-align: center;
      font-size: 0.76rem;
      color: var(--gold-primary);
      padding-top: 10px;
      border-top: 1px solid var(--gold-border);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .parchment .source-badge {
      color: #7d5a12;
      border-top-color: rgba(125, 90, 18, 0.25);
      font-weight: 600;
    }

    .benefits-section {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--gold-border);
    }

    .parchment .benefits-section {
      border-top-color: rgba(125, 90, 18, 0.25);
    }

    .benefits-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .parchment .benefits-title {
      color: #1c2b24;
    }

    .benefits-list {
      padding-left: 18px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .parchment .benefits-list {
      color: #2f4238;
    }

    /* Action Bar (Audio / Language / Font / Focus) */
    .dua-toolbar-strip {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 12px;
    }

    .mini-tool-btn {
      flex: 1;
      background: rgba(13, 40, 33, 0.85);
      border: 1px solid var(--gold-border);
      color: var(--gold-light);
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mini-tool-btn:hover {
      border-color: var(--gold-primary);
      background: var(--bg-card-hover);
    }

    .dual-action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .action-pill-btn {
      background: rgba(13, 40, 33, 0.9);
      border: 1px solid var(--gold-primary);
      color: var(--text-main);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-pill-btn:hover, .action-pill-btn.active {
      background: var(--emerald-accent);
      color: var(--gold-light);
    }

    /* --- AUDIO PLAYER SCREEN (Screen 46) --- */
    .audio-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .reciter-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .reciter-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--gold-primary);
      object-fit: cover;
      background: #14382e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 1.3rem;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      position: relative;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .progress-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-light));
      border-radius: 99px;
      position: relative;
    }

    .progress-knob {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--gold-light);
      box-shadow: 0 0 10px var(--gold-primary);
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .player-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;
    }

    .play-main-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, #21785e 0%, #0f3d2f 100%);
      border: 2px solid var(--gold-primary);
      color: var(--gold-light);
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.3);
    }

    /* Radio Option Rows (Screens 46, 47, 48) */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .option-row {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: 14px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-row.selected {
      border-color: var(--gold-primary);
      background: rgba(24, 97, 76, 0.35);
    }

    .radio-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.86rem;
    }

    .radio-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .option-row.selected .radio-circle::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-light);
    }

    .size-btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0 18px 0;
    }

    .size-btn {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--emerald-accent);
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    /* Primary CTA Button */
    .primary-cta-btn {

    function showToast(msg) {

      const idx = state.favourites.indexOf(duaId);
      if (idx > -1) {
        state.favourites.splice(idx, 1);
        showToast('Removed from Favourites');
      } else {
        state.favourites.push(duaId);
        showToast('Saved to Favourites');
      }
      renderScreen(state.currentScreen);

    function getTranslationText(dua) {
      if (state.language === 'Urdu') return dua.urduTranslation || dua.translation;
      if (state.language === 'Roman Urdu') return dua.romanUrduTranslation || dua.transliteration || dua.translation;
      if (state.language === 'Hindi') return dua.hindiTranslation || dua.translation;
      return dua.translation;

    /* ==========================================================================
       3. MASTER SCREEN ROUTER
       ========================================================================== */
    function renderScreen(screenNum, customDuaId = null, preserveSlide = false) {
      if (screenNum !== state.currentScreen) {
        state.previousScreen = state.currentScreen;
      }
      state.currentScreen = screenNum;
      if (customDuaId) state.selectedDuaId = customDuaId;

      // Rotate Featured Slide automatically whenever user visits Screen 37
      if (screenNum === 37 && !preserveSlide) {
        state.featuredSlideIndex = (state.featuredSlideIndex + 1) % DUAS_LIST.length;
      }

      const vp = document.getElementById('appViewport');
      vp.scrollTop = 0;

      switch (screenNum) {
        case 37: vp.innerHTML = view37Home(); break;
        case 38: vp.innerHTML = view38Categories(); break;
        case 39: vp.innerHTML = view39CategoryDetail(); break;
        case 40: vp.innerHTML = view40Search(state.searchQuery); break;
        case 41: vp.innerHTML = view41SearchResults('travel'); break;
        case 42: vp.innerHTML = view42DetailStandard(); break;
        case 43: vp.innerHTML = view43DetailIllustrated(); break;
        case 44: vp.innerHTML = view44Marketplace(); break;
        case 45: vp.innerHTML = view45FocusMode(); break;
        case 46: vp.innerHTML = view46AudioPlayer(); break;
        case 47: vp.innerHTML = view47Language(); break;
        case 48: vp.innerHTML = view48FontSettings(); break;
        case 49: vp.innerHTML = view49Favourites(); break;
        case 50: vp.innerHTML = view50Share(); break;
        case 51: vp.innerHTML = view51CopyModal(); break;
        case 52: vp.innerHTML = view52SourceRef(); break;
        case 54: vp.innerHTML = view54NoMatches(); break;
        case 99: vp.innerHTML = view99AdminModal(); break;
        default: vp.innerHTML = view37Home();
      }
    }

    function clearSearchBar() {
      state.searchQuery = '';
      const input = document.getElementById('liveSearchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      const box = document.getElementById('searchResultsContainer');
      if (box) {
        box.innerHTML = renderSearchMatchesHTML('');
      }
    }

    function renderSearchMatchesHTML(query) {
      const q = (query || '').toLowerCase().trim();
      // When search bar is empty, show every dua in the list by default
      const matches = !q ? DUAS_LIST : DUAS_LIST.filter(d => {
        if (state.searchFilter === 'Arabic') return d.arabic.includes(q);
        if (state.searchFilter === 'Transliteration') return d.transliteration.toLowerCase().includes(q);
        if (state.searchFilter === 'Translation') return d.translation.toLowerCase().includes(q) || (d.romanUrduTranslation && d.romanUrduTranslation.toLowerCase().includes(q));
        return (
          d.title.toLowerCase().includes(q) ||
          d.subtitle.toLowerCase().includes(q) ||
          d.transliteration.toLowerCase().includes(q) ||
          d.translation.toLowerCase().includes(q) ||
          (d.romanUrduTranslation && d.romanUrduTranslation.toLowerCase().includes(q)) ||
          d.arabic.includes(q)
        );
      });

      if (matches.length === 0) {
        return `
          <div class="empty-state-box" style="padding:28px 10px;">
            <div class="empty-illustration" style="width:90px;height:90px;font-size:2rem;"><i class="bi bi-search"></i></div>
            <div class="card-title">No matching duas for "${query}"</div>
            <p class="card-sub" style="margin-top:6px;">Try a different keyword or clear the search bar to see all duas.</p>
          </div>
        `;
      }

      return matches.map(d => `
        <div class="dua-list-card" onclick="openDuaDetail('${d.id}')">
          <div class="medallion-icon"><span class="medallion-arabic">${d.arabicMedallion || 'دعا'}</span></div>
          <div class="card-body-text">
            <div class="card-title">${d.title}</div>
            <div class="card-sub">${d.subtitle}</div>
            <div class="card-meta">${d.source}</div>
          </div>
          <i class="bi bi-chevron-right card-chevron"></i>
        </div>
      `).join('');
    }

    function handleLiveSearch(val) {
      state.searchQuery = val;
      const box = document.getElementById('searchResultsContainer');
      if (box) {
        box.innerHTML = renderSearchMatchesHTML(val);
      }
    }

          <!-- Parchment Bottom Sheet -->
          <div class="copy-sheet">
            <div style="text-align:center; font-weight:700; font-size:1rem; margin-bottom:12px;">Copy</div>

            <div class="copy-check-row" onclick="state.copyOptions.arabic = !state.copyOptions.arabic; renderScreen(51);">
              <span><i class="bi ${state.copyOptions.arabic ? 'bi-check-square-fill' : 'bi-square'}" style="color:#18614c; margin-right:8px;"></i> Arabic Text</span>
              ${state.copyOptions.arabic ? '<i class="bi bi-check2" style="color:#18614c;"></i>' : ''}
            </div>

            <div class="copy-check-row" onclick="state.copyOptions.transliteration = !state.copyOptions.transliteration; renderScreen(51);">
              <span><i class="bi ${state.copyOptions.transliteration ? 'bi-check-square-fill' : 'bi-square'}" style="color:#18614c; margin-right:8px;"></i> Transliteration</span>
              ${state.copyOptions.transliteration ? '<i class="bi bi-check2" style="color:#18614c;"></i>' : ''}
            </div>

            <div class="copy-check-row" onclick="state.copyOptions.translation = !state.copyOptions.translation; renderScreen(51);">
              <span><i class="bi ${state.copyOptions.translation ? 'bi-check-square-fill' : 'bi-square'}" style="color:#18614c; margin-right:8px;"></i> Translation</span>
              ${state.copyOptions.translation ? '<i class="bi bi-check2" style="color:#18614c;"></i>' : ''}
            </div>

            <button class="primary-cta-btn" style="margin-top:16px;" onclick="copySelectedFields()">Copy</button>
            <button class="primary-cta-btn" style="margin-top:8px; background:transparent; color:#1c2b24; border-color:rgba(0,0,0,0.2);" onclick="renderScreen(42)">Cancel</button>
          </div>
        </div>
      `;
    }

    function copySelectedFields() {
      const dua = getDua(state.selectedDuaId);
      let parts = [];
      if (state.copyOptions.arabic) parts.push(dua.arabic);
      if (state.copyOptions.transliteration) parts.push(dua.transliteration);
      if (state.copyOptions.translation) parts.push(getTranslationText(dua));
      parts.push(`Source: ${dua.source}`);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(parts.join('\n\n'));
      }
      showToast('Copied selected text to clipboard!');
      setTimeout(() => renderScreen(42), 900);
    }

    function copyFullDuaText() {
      const dua = getDua(state.selectedDuaId);
      const text = `${dua.title}\n${dua.arabic}\n${dua.transliteration}\n${getTranslationText(dua)}\n(${dua.source})`;
      if (navigator.clipboard) navigator.clipboard.writeText(text);
      showToast('Dua link & text copied!');
    }

    /* --- SCREEN 52: Dua Source & Reference --- */
    function view52SourceRef() {
      const dua = getDua(state.selectedDuaId);
      return `
        <div style="padding: 16px 18px;">
          <div class="top-nav-row">
            <button class="back-btn" onclick="renderScreen(42)"><i class="bi bi-chevron-left"></i></button>
            <h1 class="page-title" style="font-size:1.15rem;">${dua.title}</h1>
            <div style="width:34px;"></div>
          </div>

          <div class="dua-content-box" style="text-align:left;">
            <div style="font-family:'Cinzel',serif; color:var(--gold-light); font-size:0.95rem; font-weight:600; margin-bottom:6px;">
              Source & Reference
            </div>
            <div style="font-size:0.9rem; color:var(--text-main); margin-bottom:14px;">
              ${dua.source}
            </div>

            <div style="font-size:0.82rem; color:var(--gold-primary); font-weight:600; margin-bottom:6px;">
              Also mentioned in:
            </div>
            <ul class="benefits-list" style="margin-bottom:16px;">
              ${dua.alsoMentioned.map(ref => `<li>${ref}</li>`).join('')}
            </ul>

            <div style="font-size:0.82rem; color:var(--gold-primary); font-weight:600; margin-bottom:6px;">
              Notes
            </div>
            <p style="font-size:0.82rem; color:var(--text-muted); line-height:1.55;">
              ${dua.notes}
            </p>
          </div>

          <button class="primary-cta-btn" onclick="renderScreen(42)">Back</button>
        </div>
      `;
    }

    /* --- SCREEN 54: No Matches State --- */
    function view54NoMatches() {
      return `
        <div style="padding: 16px 18px;">
          <div class="top-nav-row">
            <button class="back-btn" onclick="renderScreen(40)"><i class="bi bi-chevron-left"></i></button>
            <div style="width:34px;"></div>
          </div>

          <div class="empty-state-box">
            <div class="empty-illustration">
              <i class="bi bi-search"></i>
            </div>
            <h2 class="page-title" style="font-size:1.25rem; margin-bottom:8px;">No matching duas</h2>
            <p class="page-subtitle" style="max-width:240px; line-height:1.5;">
              We couldn't find any duas for your search.
            </p>
            <button class="primary-cta-btn" style="max-width:260px; margin-top:28px;" onclick="renderScreen(38)">
              Browse all categories
            </button>
          </div>
        </div>
      `;
    }

    /* --- SCREEN 99: ADMIN PANEL — Add New Dua & Update Category Background Image --- */
    function view99AdminModal() {
      const selectedCat = DUA_CATEGORIES.find(c => c.id === state.selectedCategoryId) || DUA_CATEGORIES[0];
      return `
        <div style="padding: 16px 18px;">
          <div class="top-nav-row">
            <button class="back-btn" onclick="renderScreen(state.previousScreen || 37)"><i class="bi bi-chevron-left"></i></button>
            <h1 class="page-title" style="font-size:1.15rem;">Admin: Add Dua & BG</h1>
            <div style="width:34px;"></div>
          </div>

          <div class="dua-content-box" style="margin-top:8px;">
            <div class="admin-form-group">
              <label class="admin-label">Select Target Category</label>
              <select id="adminCatSelect" class="admin-select" onchange="updateAdminCatBgInput(this.value)">
                ${DUA_CATEGORIES.map(c => `
                  <option value="${c.id}" ${c.id === selectedCat.id ? 'selected' : ''}>
                    ${c.title} (${getCategoryDuaCount(c.id)} duas)
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Category Hero Background URL (Optional)</label>
              <input type="url" id="adminCatBgUrl" class="admin-input" value="${selectedCat.hero || ''}" placeholder="https://images.unsplash.com/..." />
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Upload Category Background Image</label>
              <input type="file" accept="image/*" class="admin-input" onchange="handleImageUpload(this, 'adminCatBgUrl')" />
            </div>

            <hr style="border:none; border-top:1px solid var(--gold-border); margin:16px 0;" />

            <div class="admin-form-group">
              <label class="admin-label">Dua Title *</label>
              <input type="text" id="adminDuaTitle" class="admin-input" placeholder="e.g., Morning Remembrance for Peace" />
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Short Subtitle / Occasion *</label>
              <input type="text" id="adminDuaSubtitle" class="admin-input" placeholder="e.g., Recited after Fajr prayer" />
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Arabic Text *</label>
              <textarea id="adminDuaArabic" class="admin-textarea" dir="rtl" placeholder="اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا..."></textarea>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Transliteration</label>
              <textarea id="adminDuaTranslit" class="admin-textarea" placeholder="Allahumma bika asbahna wa bika amsayna..."></textarea>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">English Translation *</label>
              <textarea id="adminDuaTranslation" class="admin-textarea" placeholder="O Allah, by Your leave we have reached the morning..."></textarea>
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Roman Urdu Translation (Optional)</label>
              <input type="text" id="adminDuaRomanUrdu" class="admin-input" placeholder="Aye Allah, Tere hi hukm se humne subah ki..." />
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Source / Hadith Reference *</label>
              <input type="text" id="adminDuaSource" class="admin-input" placeholder="e.g., Jami at-Tirmidhi (3391)" />
            </div>

            <div class="admin-form-group">
              <label class="admin-label">Dua Detail Background Image URL</label>
              <input type="url" id="adminDuaHeroUrl" class="admin-input" placeholder="https://images.unsplash.com/..." />
              <input type="file" accept="image/*" class="admin-input" style="margin-top:6px;" onchange="handleImageUpload(this, 'adminDuaHeroUrl')" />
            </div>

            <button class="primary-cta-btn" onclick="submitAdminDua()">Save Dua & Update Category Count</button>
          </div>
        </div>
      `;
    }

    function updateAdminCatBgInput(catId) {
      const cat = DUA_CATEGORIES.find(c => c.id === catId);
      const input = document.getElementById('adminCatBgUrl');
      if (cat && input) input.value = cat.hero || '';
    }

    function handleImageUpload(fileInput, targetInputId) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const target = document.getElementById(targetInputId);
        if (target) target.value = e.target.result;
        showToast('Background image loaded!');
      };
      reader.readAsDataURL(file);
    }

    function submitAdminDua() {
      const catId = document.getElementById('adminCatSelect').value;
      const catBgUrl = document.getElementById('adminCatBgUrl').value.trim();
      const title = document.getElementById('adminDuaTitle').value.trim();
      const subtitle = document.getElementById('adminDuaSubtitle').value.trim();
      const arabic = document.getElementById('adminDuaArabic').value.trim();
      const transliteration = document.getElementById('adminDuaTranslit').value.trim();
      const translation = document.getElementById('adminDuaTranslation').value.trim();
      const romanUrdu = document.getElementById('adminDuaRomanUrdu').value.trim();
      const source = document.getElementById('adminDuaSource').value.trim() || 'Authentic Sunnah';
      const duaHeroUrl = document.getElementById('adminDuaHeroUrl').value.trim();

      const catObj = DUA_CATEGORIES.find(c => c.id === catId);
      if (catObj && catBgUrl) {
        catObj.hero = catBgUrl;
      }

      // Allow updating just the category background if dua fields are left blank
      if (!title && !arabic && catBgUrl) {
        saveRepository();
        state.selectedCategoryId = catId;
        showToast('Category background updated!');
        renderScreen(39);
        return;
      }

      if (!title || !arabic || !translation) {
        showToast('Please fill Title, Arabic, and Translation');
        return;
      }

      const newDua = {
        id: 'dua-' + Date.now(),
        title,
        subtitle: subtitle || 'Authentic Supplication',
        category: catId,
        variants: '1 variant',
        arabicMedallion: 'دعا',
        illustrated: true,
        heroImg: duaHeroUrl || catBgUrl || 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=900&q=80',
        arabic,
        transliteration: transliteration || '',
        translation,
        romanUrduTranslation: romanUrdu || transliteration || translation,
        source,
        alsoMentioned: [source],
        notes: `Added to ${catObj ? catObj.title : 'Duas'} collection.`,
        benefits: ['Brings remembrance and closeness to Allah.'],
        duration: '0:45'
      };

      DUAS_LIST.unshift(newDua);
      saveRepository();

      state.selectedCategoryId = catId;
      showToast(`Added to ${catObj.title} (${getCategoryDuaCount(catId)} duas)`);
      renderScreen(39);
    }

    // Boot on Screen 37 (Dua Library Home)
    window.addEventListener('DOMContentLoaded', () => {
      renderScreen(37);
    });
  </script>
</body>
</html>
